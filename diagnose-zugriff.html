<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrgaFunk – Zugriffsdiagnose</title><style>body{font:16px system-ui;background:#10283b;color:white;max-width:850px;margin:30px auto;padding:20px}button{padding:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1d394e;padding:16px;border-radius:8px}a{color:#aee}</style></head><body><h1>OrgaFunk – Zugriffsdiagnose</h1><p>Nur mit dem betroffenen Konto öffnen. Es werden keine Daten geändert.</p><button id="go">Zugriff prüfen</button> <a href="hauptseite.html">Zurück</a><pre id="out">Warte auf Anmeldung …</pre><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script>
const out=document.getElementById('out');let user=null;const log=(...a)=>out.textContent+=a.join(' ')+'\n';const db=firebase.firestore();
firebase.auth().onAuthStateChanged(u=>{user=u;out.textContent=u?'Angemeldet. Auf „Zugriff prüfen“ klicken.':'Nicht angemeldet.'});
async function read(label,ref){try{const s=await ref.get();if(!s.exists){log(label,'NICHT VORHANDEN');return null}log(label,'OK');return s.data()}catch(e){log(label,'FEHLER',e.code||'',e.message||'');return null}}
document.getElementById('go').onclick=async()=>{if(!user)return;out.textContent='';const org=sessionStorage.getItem('activeOrganisation')||'';const site=sessionStorage.getItem('activeSchool')||'';log('Aktive Organisation:',org||'(keine)');log('Aktiver Standort:',site||'(keiner)');const m=await read('Mitgliedschaften',db.collection('mitgliedschaften').doc(user.uid).collection('organisationen').doc(org));if(m)log('Rolle / Bereich / Zuordnung:',m.role,m.scope,m.school);const group=await read('Organisationsstandorte',db.doc('Schulen/MASTER/gruppen/'+org));if(group)log('Standorte:',JSON.stringify(group.School));if(site&&site.toUpperCase()!=='MASTER'){const r=await read('Standortreservierung',db.collection('standortReservierungen').doc(site));if(r)log('Reservierte Organisation:',r.group);for(const slot of ['left','center','right']){const d=await read('Logo '+slot,db.collection('schullogos').doc(site+'_'+slot));if(d)log('Logo '+slot+' – school:',d.school,'Bild vorhanden:',typeof d.image==='string'&&d.image.startsWith('data:image/'));}}log('Fertig. Bitte nur die Fehlermeldungen und Zuordnungen mitteilen; keine persönlichen Kontodaten.');};
</script></body></html>
