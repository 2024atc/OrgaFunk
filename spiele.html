<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Interaktive Inhalte</title>
  <style>
    :root { --bg:#000; --text:#fff; }
    * { box-sizing:border-box; }
    body{
      margin:0; font-family:Arial, Helvetica, sans-serif;
      background:var(--bg); color:var(--text);
      -webkit-font-smoothing:antialiased;
      min-height:100vh; display:flex; flex-direction:column;
    }

    /* ===== Header ===== */
    .header{
      display:flex; justify-content:space-between; align-items:center;
      padding:12px 16px; gap:12px;
    }
    .header img{ height:80px; width:auto; object-fit:contain; }
    @media (max-width:750px){ .header img{ height:44px; } }
    @media (max-width:480px){ .header img{ height:40px; } }

    /* ===== Weißer Viewer im Card-Stil ===== */
    .wrap{
      display:flex; flex-direction:column; align-items:center;
      gap:14px; padding:12px; width:100%;
    }
    .viewer-wrap{
      position:relative;
      width:95%; max-width:980px;
      background:#fff;
      border-radius:10px;
      box-shadow:0 4px 16px rgba(0,0,0,.35);
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      min-height:60vh;
    }
    .viewer-wrap iframe{
      width:100%; height:70vh; min-height:480px;
      border:0;
      display:block;
      background:#fff;
    }
    .hint{
      color:#aaa; font-size:13px; text-align:left;
      max-width:980px; width:95%;
    }

    /* ===== Home-Button ===== */
    .home-btn{
      position:fixed; left:20px; bottom:20px;
      background:#fff; border:none; border-radius:50%;
      padding:10px; cursor:pointer;
      box-shadow:0 2px 6px rgba(0,0,0,.35);
    }
    .home-btn img{ width:32px; height:32px; display:block; }
  </style>
  <link rel="stylesheet" href="branding-layout.css">
</head>
<body>
  <!-- Header -->

  <!-- Weißer Karten-Viewer -->
  <div class="wrap">
    <div class="viewer-wrap">
      <iframe id="spieleFrame" src="about:blank" title="Spiele" allowfullscreen></iframe>
    </div>
    <div id="spieleHint" class="hint"></div>
  </div>

  <!-- Home -->
  <button class="home-btn" onclick="location.href='hauptseite.html'">
    <img src="home.jpg" alt="Home">
  </button>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>


  <script>
if (!firebase.apps.length) firebase.initializeApp(window.firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
async function resolveSchool(user){
  let school=(sessionStorage.getItem('activeSchool')||sessionStorage.getItem('school')||'').trim().toLowerCase();
  if(!school){ const role=await db.collection('rollen').doc(user.uid).get(); school=String(role.data()?.school||'').trim().toLowerCase(); }
  return school||'master';
}
async function getLink(school){
  const variants=[school,school.toUpperCase(),school.charAt(0).toUpperCase()+school.slice(1)];
  for(const id of [...new Set(variants)]){
    const snap=await db.collection('links').doc(id).get();
    if(snap.exists){ const data=snap.data()||{}; const keys=['spiele', 'Spiele', 'spieleUrl', 'spieleURL', 'driveSpiele'];
      for(const key of keys){ if(typeof data[key]==='string' && data[key].trim()) return data[key].trim(); }
    }
  }
  return '';
}
function embedUrl(value){
  const url=new URL(value);
  if(url.protocol!=='https:' || !['drive.google.com','docs.google.com'].includes(url.hostname)) throw Error('Bitte einen gültigen Google-Drive-Link eintragen.');
  const match=url.pathname.match(/\/folders\/([a-zA-Z0-9_-]+)/);
  if(match) return 'https://drive.google.com/embeddedfolderview?id='+encodeURIComponent(match[1])+'#grid';
  const file=url.pathname.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(file) return 'https://drive.google.com/file/d/'+encodeURIComponent(file[1])+'/preview';
  if(url.pathname==='/embeddedfolderview' && url.searchParams.get('id'))return value;
  return value;
}
auth.onAuthStateChanged(async user=>{
  if(!user){ location.href='index.html'; return; }
  const frame=document.getElementById('spieleFrame');
  try{
    const school=await resolveSchool(user);
    const link=await getLink(school);
    if(!link){ location.href='dokumente-hilfe.html?bereich=spiele'; return; }
    frame.src=embedUrl(link);
  }catch(error){
    console.error('[spiele]',error);
    frame.style.display='none';
    const msg=document.createElement('p');msg.textContent='Die Ablage konnte nicht geladen werden: '+error.message;
    frame.parentElement.appendChild(msg);
  }
});
</script>
  <script src="branding-layout.js"></script>
</body>
</html>
