<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OrgaFunk – Mitgliedschaften prüfen</title><link rel="stylesheet" href="branding-layout.css"><style>
body{background:#071522;color:#e8f5ff;font:16px Arial,sans-serif;margin:0;min-height:100vh;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px}header img{height:70px;max-width:30%;object-fit:contain}header img:nth-child(2){height:90px}main{width:min(760px,calc(100% - 28px));margin:30px auto;flex:1}.card{background:#102438;border:1px solid #31607b;border-radius:16px;padding:25px}h1{font-size:26px}.item{border:1px solid #31607b;border-radius:10px;padding:15px;margin:12px 0}button{background:#159ed9;border:0;color:white;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:bold}button:disabled{opacity:.5}a{color:#80d6ff}#status{line-height:1.6}footer{text-align:center;padding:16px;color:#a7c4d5}



/* Einheitlicher Home-Button wie in einstellungen.html */
.home-btn{position:fixed;left:18px;bottom:18px;z-index:1000;width:48px;height:48px;border:none;border-radius:9999px;display:grid;place-items:center;background:#fff;color:#000;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,opacity .2s ease;padding:0}
.home-btn:hover{transform:translateY(-1px) scale(1.04);box-shadow:0 8px 22px rgba(0,0,0,.45)}
.home-btn:active{transform:translateY(0) scale(.98);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.home-btn img{width:22px;height:22px;display:block;pointer-events:none}
</style></head><body><button class="home-btn" type="button" onclick="location.href='hauptseite.html'" aria-label="Zur Startseite"><img src="home.jpg" alt=""></button><header><img src="branding/atc.png" alt="ATC"><img src="branding/orgafunk.png" alt="OrgaFunk"><img src="branding/drakory.png" alt="Drakory"></header><main><div class="card"><h1>Meine Organisationsmitgliedschaften</h1><p>Hier siehst du deine bereits gespeicherten Mitgliedschaften. Deine bisherige Rolle wird nicht verändert.</p><div id="status" role="status">Lade …</div><div id="list"></div><button id="migrate" hidden>Bestehende Gruppenzuordnung übernehmen</button><p><a href="hauptseite.html">Zur Hauptseite</a> · <a href="weitere-organisation-erstellen.html">Weitere Organisation erstellen</a></p></div></main><footer>OrgaFunk – Advanced Tech Creations</footer>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script>
'use strict';if(!firebase.apps.length)firebase.initializeApp(window.firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),statusEl=document.getElementById('status'),listEl=document.getElementById('list'),migrateBtn=document.getElementById('migrate');
let current=null,legacy=null;
const allowed=['admin','si-fu','trainer','nutzer'];
function message(t){statusEl.textContent=t;}
function item(g,d){const el=document.createElement('div');el.className='item';const name=document.createElement('strong');name.textContent=g;const details=document.createElement('div');details.textContent='Rolle: '+(d.role||'–')+' · Bereich: '+(d.scope||'–')+' · Zuordnung: '+(d.school||'–');el.append(name,details);listEl.append(el);}
async function refresh(){listEl.replaceChildren();migrateBtn.hidden=true;const user=current;if(!user)return;
try{const [r,m]=await Promise.all([db.collection('rollen').doc(user.uid).get(),db.collection('mitgliedschaften').doc(user.uid).collection('organisationen').get()]);
legacy=r.exists?r.data():null;
m.forEach(doc=>item(doc.id,doc.data()));
if(legacy&&legacy.school==='MASTER'){message('MASTER bleibt plattformweiter Superadministrator. Keine Migration erforderlich.');return;}
if(legacy&&allowed.includes(legacy.role)&&legacy.school){const g=legacy.school;const group=await db.doc('Schulen/MASTER/gruppen/'+g).get().catch(()=>null);
if(group?.exists){if(!m.docs.some(x=>x.id===g)){migrateBtn.hidden=false;message('Deine bisherige Gruppenzuordnung kann unverändert als Mitgliedschaft übernommen werden.');}else message('Deine bisherige Gruppenzuordnung ist bereits übernommen.');}
else message('Deine bisherige Zuordnung ist möglicherweise standortgebunden. Sie wird aus Sicherheitsgründen nicht automatisch als gruppenweite Berechtigung übernommen.');
}else if(!legacy)message('Kein bisheriges Rollenprofil vorhanden.');else message('Deine bisherige Rolle kann nicht automatisch übernommen werden.');
if(m.empty){const e=document.createElement('p');e.textContent='Noch keine neuen Mitgliedschaften gespeichert.';listEl.append(e);}
}catch(e){console.error(e);message('Laden fehlgeschlagen: '+(e.message||e));}}
migrateBtn.onclick=async()=>{if(!current||!legacy)return;const g=legacy.school;migrateBtn.disabled=true;try{await db.collection('mitgliedschaften').doc(current.uid).collection('organisationen').doc(g).set({role:legacy.role,scope:'gruppe',school:g});await refresh();}catch(e){console.error(e);message('Übernahme nicht möglich: '+(e.message||e));}finally{migrateBtn.disabled=false;}};
auth.onAuthStateChanged(u=>{current=u;if(!u){message('Bitte zuerst anmelden.');return;}refresh();});
</script><script src="branding-layout.js"></script></body></html>
