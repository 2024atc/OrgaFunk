<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OrgaFunk | Anmeldung</title>
  <style>
    :root { --bg:#000; --text:#fff; --pill:#fff; --pillText:#000; }
    * { box-sizing: border-box; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family: Arial, Helvetica, sans-serif;
      min-height:100vh; display:flex; flex-direction:column;
    }

    .header {
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 12px; gap:10px;
    }
    .header img { height:80px; width:auto; object-fit:contain; }

    .info-wrap { width:100%; display:flex; justify-content:center; padding:10px 12px; }
    .info-card {
      width:100%; max-width:800px; background:#fff; color:#111;
      border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.35);
      overflow:hidden; border:1px solid rgba(0,0,0,.2);
    }
    .info-card iframe { width:100%; border:0; display:block; background:#fff; }

    .wrap {
      flex:1; display:flex; flex-direction:column; align-items:center; gap:14px;
      padding:12px;
    }
    .row {
      display:flex; align-items:center; gap:12px; width:100%;
      max-width:560px;
    }
    .pill {
      background:var(--pill); color:var(--pillText);
      padding:10px 16px; border-radius:14px; font-weight:bold; min-width:110px;
      text-align:center; white-space:nowrap;
    }
    .input {
      flex:1; background:var(--pill); color:#111;
      border:none; border-radius:10px; padding:12px 14px; font-size:16px;
      outline:none;
    }
    .login-btn {
      background:#fff; color:#000; border:none; border-radius:16px;
      padding:10px 24px; font-size:18px; cursor:pointer;
      box-shadow:0 2px 6px rgba(0,0,0,.35); margin-top:6px;
    }
    .login-btn[disabled]{ opacity:.6; cursor:default; }

    /* Neuer Button */
    .forgot-btn {
      background:none; border:none; color:#8cf; cursor:pointer;
      text-decoration:underline; font-size:14px; margin-top:4px;
    }
    .forgot-btn:hover { color:#adf; }

    .msg {
      width:100%; max-width:560px; min-height:40px;
      background:#fff; color:#111; border-radius:6px;
      display:flex; align-items:center; padding:8px 10px; margin-top:6px;
      font-size:14px;
    }
    .msg.empty { background:rgba(255,255,255,.12); color:#ddd; border:1px solid #333; }

    @media (max-width:480px){
      .header img{ height:36px; }
      .pill{ min-width:96px; padding:8px 12px; }
    }

    /* OrgaFunk: ATC-inspiriertes Dunkelblau-/Cyan-Design; Authentifizierung bleibt unverändert. */
    :root {--bg:#071522;--text:#edf7ff;--pill:#102b40;--pillText:#d9efff;--cyan:#39b6e9;--orange:#ff8b18;}
    body {background:radial-gradient(ellipse at 50% 0%,#123954 0%,#071522 60%,#040d17 100%);color:var(--text);}
    .header {padding:22px clamp(20px,5vw,90px);background:rgba(2,12,24,.65);border-bottom:1px solid #28516b;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);align-items:center;gap:clamp(25px,6vw,120px);width:100%;}
    .header img {height:clamp(72px,8vw,112px);max-width:100%;width:auto;object-fit:contain;justify-self:center;}
    .header #logo-center {max-width:100%;height:clamp(80px,10vw,135px);}
    .info-wrap {padding:30px 20px 12px;}
    .info-card {max-width:1050px;width:100%;}
    .info-card iframe {height:280px;min-height:280px;background:#071522;}
    .info-card {background:#102438;border:1px solid #31607b;box-shadow:0 15px 50px #0007;border-radius:18px;}
    .wrap {padding:28px 16px 50px;gap:17px;}
    .pill {background:#102b40;color:#cfe9fb;border:1px solid #38627c;}
    .input {background:#eaf5fd;border:2px solid transparent;color:#0b2235;}
    .input:focus {border-color:var(--cyan);box-shadow:0 0 0 3px #39b6e944;}
    .login-btn {background:linear-gradient(120deg,#159ed9,#0e5c99);color:white;font-weight:700;box-shadow:0 8px 24px #0006;}
    .login-btn:hover {filter:brightness(1.15);}
    .forgot-btn {color:#78d4ff;}
    .msg.empty {background:#102538;border-color:#30516a;color:#bdd4e3;}
    @media(max-width:480px){.header{gap:12px;padding:15px 8px;grid-template-columns:1fr 1.6fr 1fr}.header img{height:48px;max-width:100%}.header #logo-center{height:58px;max-width:100%}.info-wrap{padding:18px 10px 8px}.info-card iframe{height:340px;min-height:340px}.row{gap:7px}.pill{min-width:86px;padding:10px 7px}}
  </style>
  <link rel="stylesheet" href="branding-layout.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <img id="logo-left" src="branding/atc.png" alt="Logo links">
    <img id="logo-center" src="branding/orgafunk.png" alt="Logo Mitte">
    <img id="logo-right" src="branding/drakory.png" alt="Logo rechts">
  </div>

  <!-- Hinweise bleiben wie bisher erhalten. -->
  <!-- Nutzung.html oben einblenden -->
  <div class="info-wrap">
    <div class="info-card">
      <iframe id="nutzungFrame" src="Nutzung.html" title="Nutzung / Hinweise"></iframe>
    </div>
  </div>

  <!-- Login-Form -->
  <div class="wrap">
    <div class="row">
      <div class="pill">E-Mail</div>
      <input id="user" class="input" type="email" autocomplete="username" />
    </div>

    <div class="row">
      <div class="pill">Passwort</div>
      <input id="pass" class="input" type="password" autocomplete="current-password" />
    </div>

    <button class="login-btn" id="loginBtn">Login</button>

    <!-- 🆕 Passwort vergessen -->
    <button class="forgot-btn" id="forgotBtn">Passwort vergessen?</button>

    <div id="msg" class="msg empty"> </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>

  <!-- Zentrale Firebase-Config (statt hardcodierter initializeApp-Config) -->
  <script src="firebase-config.js"></script>


  <script>
    // ---------- Firebase Init (zentral) ----------
    firebase.initializeApp(window.firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.firestore();

    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

    // ---------- Auto-Weiterleitung ----------
    auth.onAuthStateChanged((user) => {
      if (user) {
        if (!sessionStorage.getItem("role") || !sessionStorage.getItem("school")) {
          db.collection("rollen").doc(user.uid).get().then((snap)=>{
            let role = "user";
            let school = "";
            if (snap.exists) {
              const data = snap.data();
              role   = (data.role || "user").toLowerCase();
              school = data.school || "";
            }
            sessionStorage.setItem("role", role);
            sessionStorage.setItem("school", school);
            sessionStorage.setItem("loggedInUser", user.email || "");
            location.href = "hauptseite.html";
          }).catch(()=>{
            sessionStorage.setItem("role","user");
            sessionStorage.setItem("school","");
            sessionStorage.setItem("loggedInUser", user.email || "");
            location.href = "hauptseite.html";
          });
        } else {
          location.href = "hauptseite.html";
        }
      }
    });

    // Hinweisfenster mit bewusst festgelegter, gut lesbarer Höhe.
    // Kein automatisches Verkleinern anhand des iFrame-Inhalts.

    // ---------- UI-Helfer ----------
    const $ = (s)=>document.querySelector(s);
    const msg = (t, ok=false)=>{
      const box = $("#msg");
      box.textContent = t || " ";
      box.classList.toggle("empty", !t);
      box.style.background = ok ? "#e7ffe7" : "#fff";
    };

    // ---------- Login ----------
    $("#user").addEventListener("keydown", e => { if (e.key === "Enter") $("#pass").focus(); });
    $("#pass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
    $("#loginBtn").addEventListener("click", doLogin);

    async function doLogin(){
      const email = $("#user").value.trim();
      const pass  = $("#pass").value;
      if (!email || !pass) { msg("Bitte E-Mail und Passwort eingeben."); return; }

      const btn = $("#loginBtn");
      btn.disabled = true; msg("Anmeldung …");

      try {
        const cred = await auth.signInWithEmailAndPassword(email, pass);
        const uid  = cred.user.uid;

        const snap = await db.collection("rollen").doc(uid).get();
        let role = "user";
        let school = "";
        if (snap.exists) {
          const data = snap.data();
          role   = (data.role || "user").toLowerCase();
          school = data.school || "";
        }

        sessionStorage.setItem("loggedInUser", email);
        sessionStorage.setItem("role", role);
        sessionStorage.setItem("school", school);

        msg("Erfolgreich angemeldet.", true);
        setTimeout(()=> location.href = "hauptseite.html", 300);

      } catch (err) {
        console.error("[Login Fehler]", err);
        let human = "Login fehlgeschlagen.";
        if (err.code === "auth/invalid-email") human = "E-Mail-Adresse ist ungültig.";
        else if (err.code === "auth/user-disabled") human = "Konto ist deaktiviert.";
        else if (err.code === "auth/user-not-found" || err.code === "auth/wrong-password") human = "E-Mail oder Passwort falsch.";
        else if (err.code === "auth/too-many-requests") human = "Zu viele Versuche. Bitte kurz warten.";
        else if (err.code === "auth/network-request-failed") human = "Netzwerkfehler. Bitte Verbindung prüfen.";
        msg(human);
      } finally {
        btn.disabled = false;
      }
    }

    // ---------- Passwort-vergessen ----------
    $("#forgotBtn").addEventListener("click", async () => {
      const email = $("#user").value.trim();
      if (!email) { msg("Bitte zuerst Ihre E-Mail-Adresse eingeben."); return; }

      msg("Sende E-Mail zum Zurücksetzen …");
      try {
        await auth.sendPasswordResetEmail(email);
        msg("E-Mail zum Zurücksetzen wurde gesendet.", true);
      } catch (err) {
        console.error("[Passwort zurücksetzen Fehler]", err);
        let human = "Fehler beim Senden der E-Mail.";
        if (err.code === "auth/invalid-email") human = "E-Mail-Adresse ist ungültig.";
        else if (err.code === "auth/user-not-found") human = "Kein Konto mit dieser E-Mail gefunden.";
        else if (err.code === "auth/network-request-failed") human = "Netzwerkfehler. Bitte Verbindung prüfen.";
        msg(human);
      }
    });
  </script>
  <script src="branding-layout.js"></script>
</body>
</html>
