<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Materialübersicht | OrgaFunk</title><link rel="stylesheet" href="branding-layout.css">
<style>
:root{--bg:#000;--text:#fff;--accent-bg:#fff;--accent-text:#000}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font:16px Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
main{width:min(1160px,100%);margin:0 auto;padding:25px 18px 90px;flex:1}h1{margin:0 0 10px}p{line-height:1.5}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.card{border:1px solid #7777;border-radius:12px;background:color-mix(in srgb,var(--bg) 90%,var(--text) 10%);padding:15px;overflow-wrap:anywhere}.card img{display:block;width:100%;height:170px;object-fit:contain;background:white;border-radius:8px}.card h2{font-size:19px;margin:12px 0 5px}.card p{white-space:pre-wrap}.card a{display:inline-block;margin-top:8px}.actions{display:flex;gap:8px;margin-top:14px}.btn{border:1px solid #888;border-radius:8px;padding:10px 14px;background:var(--accent-bg);color:var(--accent-text);font:inherit;cursor:pointer;text-decoration:none}.btn.secondary{background:transparent;color:var(--text)}.btn:disabled{opacity:.5;cursor:not-allowed}.muted{opacity:.8}.status{margin:15px 0}.home-btn{position:fixed;left:18px;bottom:18px;border:0;border-radius:50%;background:#fff;padding:10px;cursor:pointer;box-shadow:0 2px 6px #0007}.home-btn img{width:32px;height:32px;display:block}dialog{max-width:530px;width:calc(100% - 24px);border-radius:12px;border:1px solid #888;padding:22px;background:var(--bg);color:var(--text)}dialog::backdrop{background:#000a}form{display:grid;gap:10px}label{display:grid;gap:5px}input,textarea{width:100%;padding:10px;border:1px solid #888;border-radius:6px;font:inherit}textarea{min-height:90px;resize:vertical}.image-preview{max-width:220px;max-height:160px;object-fit:contain;background:#fff;border-radius:8px;padding:5px}.image-options{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.hint{font-size:13px;opacity:.8}.public-settings{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0;padding:12px 14px;border:1px solid #7777;border-radius:10px}.public-settings label{display:flex;align-items:center;gap:9px}.public-settings input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent-bg)}.public-settings p{margin:0}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
/* HTML-hidden muss auch bei Elementen mit display:flex zuverlässig gelten. */
[hidden]{display:none!important}
/* Die Freigabeverwaltung bleibt unabhängig von CSS/Branding ausschließlich Admins vorbehalten. */
#publicSettings{display:none!important}
body.access-granted.admin-verified #publicSettings:not([hidden]){display:flex!important}
/* Bis zur Berechtigungsprüfung keine Inhalte oder Branding anzeigen. */
body:not(.access-granted):not(.access-denied){visibility:hidden}
body.access-denied{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#000;color:#fff;padding:24px;text-align:center}
body.access-denied #accessDeniedMessage{font-size:20px;font-weight:600;line-height:1.5}
</style></head><body>
<main><h1>Materialübersicht</h1><p id="scope" class="muted">Standort wird ermittelt …</p>
<div id="publicSettings" class="public-settings" hidden><label><input type="checkbox" id="publicToggle"> <strong>Öffentlich</strong></label><span id="publicInfo" class="muted">Nur Administratoren können die Freigabe ändern.</span><button class="btn secondary" id="copyPublicLink" type="button" hidden>Öffentlichen Link kopieren</button></div>
<div class="toolbar"><span id="count"></span><button class="btn" id="add" hidden>+ Material hinzufügen</button></div>
<p id="status" class="status" role="status">Materialien werden geladen …</p><div id="grid" class="grid"></div></main>
<button class="home-btn" id="homeButton" onclick="location.href='hauptseite.html'" aria-label="Zur Hauptseite"><img src="home.jpg" alt="Home"></button>
<dialog id="editor"><form id="editForm"><h2 id="editorTitle">Material</h2><label>Bezeichnung *<input id="name" maxlength="120" required></label><label>Beschreibung / Hinweise<textarea id="description" maxlength="2000"></textarea></label><label>Bild-URL (https://, alternativ zum Upload)<input id="image" type="url" placeholder="https://..."></label><label>Bild vom Gerät hochladen (JPG, PNG, WebP)<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="image-options"><img id="imagePreview" class="image-preview" alt="Bildvorschau" hidden><button type="button" class="btn secondary" id="removeImage" hidden>Bild entfernen</button></div><p class="hint">Bilder werden automatisch auf höchstens 600 × 600 Pixel verkleinert und komprimiert. Ein Upload ersetzt die bisherige Bild-URL.</p><label>Link zum Material (https://)<input id="link" type="url" placeholder="https://..."></label><label>Reihenfolge<input id="order" type="number" min="0" max="9999" value="100"></label><div class="form-actions"><button type="button" class="btn secondary" id="cancel">Abbrechen</button><button type="submit" class="btn" id="save">Speichern</button></div></form></dialog>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="schullogos.js"></script>
<script>
if(!firebase.apps.length)firebase.initializeApp(window.firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);
let school='',canEdit=false,editing=null,items=[],uploadedImage='',removeExistingImage=false,uploadToken=0,publicEnabled=false,loggedIn=false;
const clean=s=>String(s||'').trim();
function safeUrl(raw){try{const u=new URL(raw);return u.protocol==='https:'?u.href:''}catch{return ''}}
function imageSource(raw){return typeof raw==='string'&&/^data:image\/webp;base64,[A-Za-z0-9+/=]+$/.test(raw)&&raw.length<=160000?raw:safeUrl(raw)}
function publicLink(){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('standort',school);return u.href}
function grantPageAccess(){document.body.classList.remove('access-denied');document.body.classList.add('access-granted')}
function denyPageAccess(){
 document.body.replaceChildren();
 const message=document.createElement('div');
 message.id='accessDeniedMessage';
 message.textContent='Du bist nicht berechtigt, diese Seite zu sehen.';
 document.body.append(message);
 document.body.classList.remove('access-granted');
 document.body.classList.add('access-denied');
}
function showStatus(s){$('status').textContent=s;$('status').hidden=!s}
function draw(){const grid=$('grid');grid.replaceChildren();$('count').textContent=items.length+' Einträge';showStatus(items.length?'':'Für diesen Standort sind noch keine Materialien hinterlegt.');
 for(const item of items){const d=item.data(),card=document.createElement('article');card.className='card';const img=imageSource(d.image);if(img){const i=document.createElement('img');i.src=img;i.alt=d.name||'Material';i.loading='lazy';i.referrerPolicy='no-referrer';card.append(i)}
 const title=document.createElement('h2');title.textContent=d.name||'Ohne Bezeichnung';card.append(title);
 if(d.description){const p=document.createElement('p');p.textContent=d.description;card.append(p)}
 const link=safeUrl(d.link);if(link){const a=document.createElement('a');a.href=link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Material öffnen';card.append(a)}
 if(canEdit){const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='btn secondary';edit.textContent='Bearbeiten';edit.onclick=()=>openEditor(item);const del=document.createElement('button');del.className='btn secondary';del.textContent='Löschen';del.onclick=()=>remove(item);actions.append(edit,del);card.append(actions)}grid.append(card)} }
function refreshPreview(){const src=removeExistingImage?'':(uploadedImage||imageSource($('image').value));$('imagePreview').hidden=!src;if(src)$('imagePreview').src=src;else $('imagePreview').removeAttribute('src');$('removeImage').hidden=!src}
function openEditor(item=null){editing=item;uploadedImage='';removeExistingImage=false;uploadToken++;$('imageFile').value='';$('editorTitle').textContent=item?'Material bearbeiten':'Material hinzufügen';const d=item?.data()||{};for(const id of ['name','description','image','link'])$(id).value=d[id]||'';$('order').value=d.order??100;refreshPreview();$('editor').showModal()}
function loadPicture(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Bild konnte nicht gelesen werden.'))};img.src=url})}
async function compressImage(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Nur JPG, PNG und WebP sind erlaubt.');if(file.size>15*1024*1024)throw new Error('Die Bilddatei darf maximal 15 MB groß sein.');const img=await loadPicture(file);if(!img.naturalWidth||!img.naturalHeight)throw new Error('Ungültiges Bild.');for(const side of [600,480,360,280,200]){const scale=Math.min(1,side/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Bildverarbeitung nicht verfügbar.');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);for(const quality of [.78,.62,.45,.3]){const result=canvas.toDataURL('image/webp',quality);if(!result.startsWith('data:image/webp;'))throw new Error('Dein Browser unterstützt die WebP-Konvertierung nicht.');if(result.length<=120000)return result}}throw new Error('Bild konnte nicht ausreichend komprimiert werden.')}
$('imageFile').onchange=async()=>{const file=$('imageFile').files?.[0];if(!file)return;const token=++uploadToken;$('save').disabled=true;try{const result=await compressImage(file);if(token!==uploadToken)return;uploadedImage=result;removeExistingImage=false;$('image').value='';refreshPreview()}catch(err){if(token===uploadToken){$('imageFile').value='';alert(err.message)}}finally{if(token===uploadToken)$('save').disabled=false}};
$('image').oninput=()=>{if(clean($('image').value)){uploadedImage='';removeExistingImage=false;$('imageFile').value=''}refreshPreview()};
$('removeImage').onclick=()=>{uploadToken++;uploadedImage='';removeExistingImage=true;$('image').value='';$('imageFile').value='';$('save').disabled=false;refreshPreview()};
async function remove(item){if(!canEdit||!confirm('„'+(item.data().name||'Material')+'“ wirklich löschen?'))return;try{await item.ref.delete();await load()}catch(e){alert('Löschen fehlgeschlagen: '+e.message)}}
async function load(){try{const snap=await db.collection('materialuebersicht').doc(school).collection('items').get();items=snap.docs.sort((a,b)=>(Number(a.data().order??100)-Number(b.data().order??100))||String(a.data().name||'').localeCompare(String(b.data().name||''),'de'));draw()}catch(e){console.error(e);showStatus('Materialien konnten nicht geladen werden. Bitte Firestore-Berechtigungen prüfen.')}}
async function loadPublicSetting(){
 const snap=await db.collection('materialFreigaben').doc(school).get();
 publicEnabled=snap.exists&&snap.data()?.oeffentlich===true;
 $('publicToggle').checked=publicEnabled;
 $('copyPublicLink').hidden=!publicEnabled;
 $('publicInfo').textContent=publicEnabled?'Diese Materialliste ist ohne Anmeldung über den öffentlichen Link sichtbar.':'Nur angemeldete, berechtigte Nutzer können diese Materialliste sehen.';
}
$('publicToggle').onchange=async()=>{
 if(!canEdit)return;
 const toggle=$('publicToggle'),next=toggle.checked;
 toggle.disabled=true;
 try{await db.collection('materialFreigaben').doc(school).set({oeffentlich:next,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:auth.currentUser.uid});
  publicEnabled=next;$('copyPublicLink').hidden=!next;
  $('publicInfo').textContent=next?'Diese Materialliste ist ohne Anmeldung über den öffentlichen Link sichtbar.':'Nur angemeldete, berechtigte Nutzer können diese Materialliste sehen.';
 }catch(e){toggle.checked=!next;alert('Freigabe konnte nicht gespeichert werden: '+e.message)}finally{toggle.disabled=false}
};
$('copyPublicLink').onclick=async()=>{const link=publicLink();try{await navigator.clipboard.writeText(link);alert('Öffentlicher Link kopiert.')}catch(e){prompt('Diesen Link kopieren:',link)}};
$('add').onclick=()=>openEditor();$('cancel').onclick=()=>{uploadToken++;$('editor').close()};
$('editForm').onsubmit=async e=>{e.preventDefault();if(!canEdit)return;const name=clean($('name').value),image=uploadedImage||(removeExistingImage?'':clean($('image').value)),link=clean($('link').value);if(!name)return;if((image&&!imageSource(image))||(link&&!safeUrl(link))){alert('Bitte ausschließlich gültige HTTPS-Links verwenden.');return}
 const data={name,description:clean($('description').value),image,link,order:Number($('order').value)||0,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};$('save').disabled=true;
 try{const col=db.collection('materialuebersicht').doc(school).collection('items');if(editing)await editing.ref.update(data);else await col.add(data);$('editor').close();await load()}catch(err){alert('Speichern fehlgeschlagen: '+err.message)}finally{$('save').disabled=false}};
async function membershipAdmin(user,site){const org=clean(sessionStorage.getItem('activeOrganisation'));if(!org)return false;
 const member=await db.collection('mitgliedschaften').doc(user.uid).collection('organisationen').doc(org).get();if(!member.exists)return false;const m=member.data()||{};if(!['admin','si-fu'].includes(String(m.role||'').toLowerCase()))return false;
 if(m.scope==='standort')return clean(m.school).toLowerCase()===site;
 if(m.scope==='gruppe'){const group=await db.collection('Schulen').doc('MASTER').collection('gruppen').doc(org).get();const sites=group.data()?.School||[];return (Array.isArray(sites)?sites:[sites]).some(s=>clean(s).toLowerCase()===site)}return false}
auth.onAuthStateChanged(async user=>{
 loggedIn=!!user;
 $('homeButton').hidden=!loggedIn;
 canEdit=false;document.body.classList.remove('admin-verified');$('add').hidden=true;$('publicSettings').hidden=true;
 const requested=clean(new URLSearchParams(location.search).get('standort')).toLowerCase();
 // Ein öffentlicher Link enthält immer eine feste Standortkennung.
 if(requested&&!/^[a-z0-9_-]{1,122}$/.test(requested)){
  if(!user){denyPageAccess();return}grantPageAccess();$('scope').textContent='Ungültiger Standort';showStatus('Der Link enthält eine ungültige Standortkennung.');return;
 }
 school=requested;
 if(!school&&user){
  school=clean(sessionStorage.getItem('activeSchool')||sessionStorage.getItem('school')).toLowerCase();
  if(!school){try{const role=await db.collection('rollen').doc(user.uid).get();school=clean(role.data()?.school).toLowerCase()}catch(e){console.warn(e)}}
 }
 if(!school||school==='master'){
  if(!user){denyPageAccess();return}
  grantPageAccess();
  $('scope').textContent='Kein Standort ausgewählt';
  showStatus(user?'Bitte auf der Hauptseite einen Standort auswählen.':'Bitte den vollständigen öffentlichen Link zu einer Materialliste öffnen.');return;
 }
 $('scope').textContent='Standort: '+school;
 if(user){
  try{const role=await db.collection('rollen').doc(user.uid).get();const d=role.data()||{};
   const master=String(d.school||'').toUpperCase()==='MASTER'&&String(d.role||'').toLowerCase()==='admin';
   const legacyAdmin=['admin','si-fu'].includes(String(d.role||'').toLowerCase())&&(
     clean(d.school).toLowerCase()===school||
     (await (async()=>{const g=await db.collection('Schulen').doc('MASTER').collection('gruppen').doc(clean(d.school)).get();const sites=g.data()?.School||[];return (Array.isArray(sites)?sites:[sites]).some(x=>clean(x).toLowerCase()===school)})())
   );
   canEdit=master||legacyAdmin||await membershipAdmin(user,school);
  }catch(e){console.warn('Adminrechte nicht lesbar',e)}
 }
 try{
  await loadPublicSetting();
  if(!user&&!publicEnabled){denyPageAccess();return}
  grantPageAccess();
  document.body.classList.toggle('admin-verified',!!user&&canEdit);
  $('publicSettings').hidden=!(user&&canEdit);
  $('add').hidden=!canEdit;
  if(window.applySchoolLogos)await window.applySchoolLogos(school);
  if(window.orgafunkApplyTheme)window.orgafunkApplyTheme(school);
  await load();
 }catch(e){console.error(e);if(!user){denyPageAccess();return}grantPageAccess();showStatus('Materialübersicht konnte nicht geladen werden. Bitte Zugriffsrechte prüfen.')}
});
</script><script src="branding-layout.js"></script></body></html>
