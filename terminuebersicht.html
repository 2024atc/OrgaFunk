<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terminübersicht | OrgaFunk</title>
<style>
:root{--bg:#000;--text:#fff}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
.wrap{padding:14px}
.week{margin-bottom:20px;background:#181818;border:1px solid #444;border-radius:10px;overflow:hidden}
.week-title{background:#252525;padding:10px 14px;font-weight:bold;font-size:20px}
.days{display:grid;grid-template-columns:repeat(5,1fr)}
.day{border-right:1px solid #333}.day:last-child{border-right:none}
.dayhead{background:#222;padding:10px;text-align:center;border-bottom:1px solid #333}
.slot{margin:8px;border:1px solid #555;border-radius:8px;overflow:hidden}
.time{background:#333;padding:6px;text-align:center;font-weight:bold}
.content{background:#111;padding:8px;min-height:72px}
.free{text-align:center;color:#666;padding-top:18px}
.home-btn{position:fixed;left:18px;bottom:18px;border:none;background:#fff;border-radius:50%;padding:10px;cursor:pointer}
.home-btn img{width:32px;height:32px}
/* Standort-Farbschema: Flächen übernehmen die eingestellte Text-/Hintergrundfarbe. */
body.of-branded .week{background:color-mix(in srgb,currentColor 7%,transparent);border-color:color-mix(in srgb,currentColor 28%,transparent)}
body.of-branded .week-title{background:color-mix(in srgb,currentColor 10%,transparent)}
body.of-branded .day{border-color:color-mix(in srgb,currentColor 20%,transparent)}
body.of-branded .dayhead{background:color-mix(in srgb,currentColor 8%,transparent);border-color:color-mix(in srgb,currentColor 20%,transparent)}
body.of-branded .slot{border-color:color-mix(in srgb,currentColor 30%,transparent)}
body.of-branded .time{background:color-mix(in srgb,currentColor 15%,transparent)}
body.of-branded .slot .content{background:color-mix(in srgb,currentColor 4%,transparent)}
body.of-branded .free{color:inherit;opacity:.65}
@media(max-width:850px){.days{grid-template-columns:repeat(5,minmax(160px,1fr));overflow-x:auto}.week{overflow-x:auto}}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.toolbar h1{margin:0;font-size:24px}.status{font-size:13px;opacity:.8}.edit-btn,.action-btn{background:#fff;color:#000;border:0;border-radius:7px;padding:7px 10px;font-weight:bold;cursor:pointer}.edit-btn{margin-top:8px}.slot .content{overflow-wrap:anywhere}.entry{display:flex;gap:8px;align-items:center;margin:6px 0}.entry input{accent-color:#ddd}.dialog-backdrop{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:9999;padding:16px}.dialog{width:min(460px,100%);background:#191919;border:1px solid #666;border-radius:14px;padding:20px}.dialog h2{margin-top:0}.dialog label{display:block;margin:12px 0}.dialog input{width:100%;padding:10px;border:1px solid #777;border-radius:7px;background:#090909;color:#fff}.dialog .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.dialog .danger{background:#b72e2e;color:white}.dialog .secondary{background:#444;color:white}.dialog .existing{border-top:1px solid #555;padding:10px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}.dialog .existing button{padding:6px 8px}.dialog .hint{font-size:13px;color:#bbb}.error{color:#ffaaaa}
</style>
  <link rel="stylesheet" href="branding-layout.css">
</head>
<body>
<div class="wrap"><div class="toolbar"><h1>Terminübersicht</h1><span id="pageStatus" class="status">Lade Standort und Berechtigungen …</span></div><div id="calendar"></div></div><div id="dialogRoot"></div>

<button class="home-btn" onclick="location.href='hauptseite.html'"><img src="home.jpg"></button>

<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="schullogos.js"></script>

<script>
if(!firebase.apps.length) firebase.initializeApp(window.firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
const labels=['Vergangene Woche','Aktuelle Woche','Nächste Woche','Übernächste Woche'];
const dayNames=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];
// Bisherige Zeitfenster bleiben für vorhandene Einträge unverändert.
const TIMES={
 'Montag':[' ','17:30 - 18:15','18:30 - 19:15','19:30 - 21:00'],
 'Dienstag':['16:30 - 17:15','17:30 - 18:15','18:30 - 20:00'],
 'Mittwoch':['16:30 - 17:15','17:30 - 18:15','18:30 - 19:15','19:30 - 21:00'],
 'Donnerstag':['16:30 - 17:15','17:30 - 18:15','18:30 - 20:00'],
 'Freitag':['16:30 - 17:15','17:30 - 18:15']
};
let activeSchool='',canEdit=false,entries=new Map(),currentUser=null;
const statusEl=document.getElementById('pageStatus');
function monday(date){const d=new Date(date);d.setDate(d.getDate()-(d.getDay()+6)%7);d.setHours(0,0,0,0);return d;}
function kw(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-y)/86400000)+1)/7);}
function localDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el;}
function groupFromSite(site){const m=String(site).match(/^(.+?)__/);return m?m[1]:'';}
async function getRights(user,site){
 const profile=await db.collection('rollen').doc(user.uid).get();
 const p=profile.exists?profile.data():{};
 if(String(p.school||'').toLowerCase()==='master' && String(p.role||'').toLowerCase()==='admin')return {read:true,edit:true};
 const group=groupFromSite(site);
 if(!group)return {read:false,edit:false};
 const memberSnap=await db.collection('mitgliedschaften').doc(user.uid).collection('organisationen').doc(group).get();
 if(!memberSnap.exists)return {read:false,edit:false};
 const m=memberSnap.data();
 const role=String(m.role||'').toLowerCase();
 const scope=String(m.scope||'').toLowerCase();
 const own=String(m.school||'').toLowerCase();
 const authorized=(scope==='gruppe'&&own===group)||(scope==='standort'&&own===site);
 return {read:authorized,edit:authorized&&['admin','si-fu'].includes(role)};
}
function render(){
 const root=document.getElementById('calendar');root.replaceChildren();
 const cm=monday(new Date());
 for(let w=-1;w<=2;w++){
  const ws=new Date(cm);ws.setDate(cm.getDate()+w*7);
  const week=node('section','week');week.appendChild(node('div','week-title',`KW ${kw(ws)} – ${labels[w+1]}`));
  const grid=node('div','days');
  for(let d=0;d<5;d++){
   const dt=new Date(ws);dt.setDate(ws.getDate()+d);const ds=localDate(dt);
   const day=node('div','day');const head=node('div','dayhead');head.append(dayNames[d],document.createElement('br'),dt.toLocaleDateString('de-DE'));day.appendChild(head);
   TIMES[dayNames[d]].forEach((time,slot)=>{
    const box=node('div','slot');box.appendChild(node('div','time',time.trim()||'Ohne Uhrzeit'));
    const content=node('div','content');const data=entries.get(ds+'|'+slot);
    const people=data?(Array.isArray(data.participants)?data.participants:(data.name?[{name:data.name,age:data.age,present:false}]:[])):[];
    if(!people.length)content.appendChild(node('div','free','Frei'));
    people.forEach((p,i)=>{
     const row=node('div','entry');const check=document.createElement('input');check.type='checkbox';check.checked=!!p.present;
     // Anwesenheit ist eine Schreiboperation und daher nur für Admins freigeschaltet.
     check.disabled=!canEdit;
     if(canEdit)check.addEventListener('change',()=>setPresent(data.id,i,check.checked,check));
     row.append(check,node('span','',String(p.name||'')+(p.age?' ('+p.age+')':'')));content.appendChild(row);
    });
    if(canEdit){const btn=node('button','edit-btn',people.length?'Einträge verwalten':'+ Eintrag hinzufügen');btn.type='button';btn.addEventListener('click',()=>openEditor(ds,slot));content.appendChild(btn);}
    box.appendChild(content);day.appendChild(box);
   });grid.appendChild(day);
  }week.appendChild(grid);root.appendChild(week);
 }
}
async function reload(){
 // Ausschließlich der aktuell ausgewählte Standort; keine alten WTplus-Sondergruppen.
 const snap=await db.collection('probetrainings').where('school','==',activeSchool).get();
 entries=new Map();snap.forEach(doc=>{const x=doc.data();entries.set(x.date+'|'+x.slot,{...x,id:doc.id});});render();
}
async function setPresent(id,index,value,checkbox){
 if(!canEdit||!id)return;
 checkbox.disabled=true;
 try{await db.runTransaction(async tx=>{const ref=db.collection('probetrainings').doc(id);const snap=await tx.get(ref);if(!snap.exists||snap.data().school!==activeSchool)throw Error('Eintrag nicht gefunden.');const list=snap.data().participants;if(!Array.isArray(list)||!list[index])throw Error('Eintrag wurde verändert.');const updated=list.map((p,i)=>i===index?{...p,present:value}:p);tx.update(ref,{participants:updated});});await reload();}
 catch(e){alert('Änderung fehlgeschlagen: '+e.message);checkbox.checked=!value;checkbox.disabled=false;}
}
function closeEditor(){document.getElementById('dialogRoot').replaceChildren();}
function openEditor(date,slot){
 if(!canEdit)return;
 const root=document.getElementById('dialogRoot');root.replaceChildren();
 const backdrop=node('div','dialog-backdrop');const panel=node('section','dialog');panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');
 panel.appendChild(node('h2','',`Einträge – ${date} · ${TIMES[dayNames[(new Date(date+'T12:00:00').getDay()+6)%7]][slot].trim()||'Ohne Uhrzeit'}`));
 const data=entries.get(date+'|'+slot);
 const people=data?(Array.isArray(data.participants)?data.participants:(data.name?[{name:data.name,age:data.age,present:false}]:[])):[];
 people.forEach((p,i)=>{const row=node('div','existing');row.appendChild(node('span','',String(p.name||'')+(p.age?' ('+p.age+')':'')));
 const del=node('button','action-btn danger','Entfernen');del.onclick=async()=>{
  if(!confirm('Diesen Eintrag wirklich entfernen?'))return;
  del.disabled=true;
  try{await db.runTransaction(async tx=>{const ref=db.collection('probetrainings').doc(data.id);const snap=await tx.get(ref);if(!snap.exists||snap.data().school!==activeSchool)throw Error('Eintrag nicht gefunden.');const list=Array.isArray(snap.data().participants)?snap.data().participants:(snap.data().name?[{name:snap.data().name,age:snap.data().age,present:false}]:[]);if(!list[i])throw Error('Eintrag nicht gefunden.');list.splice(i,1);if(!list.length)tx.delete(ref);else tx.set(ref,{participants:list},{merge:true});});closeEditor();await reload();}catch(e){alert('Löschen fehlgeschlagen: '+e.message);del.disabled=false;}
 };row.appendChild(del);panel.appendChild(row);});
 const form=document.createElement('form');const nameLabel=node('label','','Name / Bezeichnung');const name=document.createElement('input');name.type='text';name.required=true;name.maxLength=120;nameLabel.appendChild(name);
 const ageLabel=node('label','','Zusatzinformation (optional, bisher: Alter)');const age=document.createElement('input');age.type='text';age.maxLength=80;ageLabel.appendChild(age);
 const actions=node('div','actions');const save=node('button','action-btn','Eintrag hinzufügen');save.type='submit';const cancel=node('button','action-btn secondary','Schließen');cancel.type='button';cancel.onclick=closeEditor;actions.append(save,cancel);form.append(nameLabel,ageLabel,actions);
 form.onsubmit=async e=>{e.preventDefault();if(!canEdit)return;save.disabled=true;
  try{const query=await db.collection('probetrainings').where('school','==',activeSchool).where('date','==',date).where('slot','==',slot).get();
   if(query.empty){await db.collection('probetrainings').add({school:activeSchool,date,slot,participants:[{name:name.value.trim(),age:age.value.trim(),present:false}],created:firebase.firestore.FieldValue.serverTimestamp()});}
   else{const ref=query.docs[0].ref;await db.runTransaction(async tx=>{const snap=await tx.get(ref);if(!snap.exists||snap.data().school!==activeSchool)throw Error('Termin wurde verändert.');const old=snap.data();const list=Array.isArray(old.participants)?old.participants.slice():(old.name?[{name:old.name,age:old.age,present:false}]:[]);list.push({name:name.value.trim(),age:age.value.trim(),present:false});tx.set(ref,{participants:list},{merge:true});});}
   closeEditor();await reload();
  }catch(err){alert('Speichern fehlgeschlagen: '+err.message);save.disabled=false;}
 };panel.appendChild(form);backdrop.appendChild(panel);root.appendChild(backdrop);
 backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeEditor();});name.focus();
}
auth.onAuthStateChanged(async user=>{
 if(!user){location.href='index.html';return;}
 currentUser=user;
 try{
  const site=String(sessionStorage.getItem('activeSchool')||'').trim().toLowerCase();
  if(!site||site==='master'||!groupFromSite(site)){
   statusEl.textContent='Bitte auf der Hauptseite zuerst einen Standort auswählen.';return;
  }
  activeSchool=site;
  const rights=await getRights(user,site);
  if(!rights.read){statusEl.textContent='Kein Zugriff auf diesen Standort.';return;}
  canEdit=rights.edit;
  statusEl.textContent='Standort: '+site+' · '+(canEdit?'Admin – Bearbeitung möglich':'Nutzer – nur Ansicht');
  if(window.orgafunkApplyTheme)await window.orgafunkApplyTheme(site);
  await reload();
 }catch(e){statusEl.textContent='Laden fehlgeschlagen: '+e.message;console.error(e);}
});
</script>
  <script src="branding-layout.js"></script>
</body>
</html>
