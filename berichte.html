<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Berichte | OrgaFunk</title>
  <style>
    :root { --bg:#000; --text:#fff; --accent-bg:#fff; --accent-text:#000; --card:#111; --border:#333; --muted:#aaa; --hover:#1a1a1a; --red:#f44; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
    header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border)}
    header img{height:60px;object-fit:contain;transition:opacity .3s ease;}
    .content{max-width:1100px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
    .btn{background:var(--accent-bg);color:var(--accent-text);border:none;padding:10px 16px;border-radius:10px;font-weight:bold;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3);}
    .btn.ghost{background:transparent;color:#fff;border:1px solid var(--border);box-shadow:none;}
    .btn.small{font-size:13px;padding:8px 12px;border-radius:8px}
    .pill{background:#0b0b0b;color:#fff;border:1px solid var(--border);border-radius:999px;padding:8px 12px;font-size:14px;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .row > *{flex:1 1 260px}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
    input, textarea, select{width:100%;background:#000;color:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
    textarea{min-height:120px;resize:vertical}
    .list{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
    .list .item{display:flex;align-items:center;gap:8px}
    .status{display:block;text-align:center;margin-top:8px;font-size:14px;color:var(--muted)}
    .status.ok{color:#9be79b} .status.err{color:#ff9c9c}
    .topic-card{background:#0b0b0b;border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
    .topic-header{display:flex;gap:8px;align-items:center}
    .topic-header input{flex:1}
    .topic-notes{min-height:80px}
    .home-btn{position:fixed; left:18px; bottom:18px; border:none; background:#fff; color:#000; border-radius:50%; padding:10px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.35); z-index:1000;}
    .home-btn img{ width:32px; height:32px; display:block; }

    /* Dichte Checkbox-Labels */
    .inline-check{display:inline-flex;align-items:center;gap:6px;margin:0;padding:0;line-height:1}
    .inline-check input[type="checkbox"]{width:auto;height:auto;margin:0;transform:none}

    /* Zentrierter Speichern-Bereich */
    .center-actions{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}

    /* ================== DRUCK-ANSICHT ================== */
    @media print {
      body { background:#fff; color:#000; }
      header, .home-btn, .btn, .status, #readActions, #toggleAnonNames { display:none !important; }

      /* Graue Rahmen entfernen */
      .card, .topic-card { background:#fff !important; border:none !important; box-shadow:none !important; }
      input, textarea, select { background:#fff !important; color:#000 !important; border:none !important; }
      .pill { border:none !important; background:#fff !important; color:#000 !important; }

      /* Eingabeblöcke ausblenden (wie gewünscht) */
      #topicAddRow,
      #todoAddRow {
        display:none !important;
      }
    }
  </style>
  <link rel="stylesheet" href="branding-layout.css">
</head>
<body>
<header>
  <img id="logo-left" src="branding/atc.png" alt="Logo links">
  <img id="logo-center" src="branding/orgafunk.png" alt="Logo Mitte">
  <img id="logo-right" src="branding/drakory.png" alt="Logo rechts">
</header>

<div class="content" id="app" style="display:none">
  <!-- Freie Datumswahl für Berichte unabhängig von Trainings -->
  <div class="card">
    <div class="row" style="align-items:center">
      <div><label for="reportDateInput">Berichtsdatum auswählen</label><input type="date" id="reportDateInput" required></div>
      <div><label for="topicFromDb">Thema des Termins</label><input id="topicFromDb" placeholder="z. B. Monatsbesprechung oder Projektplanung"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <span id="activeRolePill" class="pill" style="display:none"></span>
      <span id="activeSchoolPill" class="pill" style="display:none"></span>
    </div>
  </div>

  <!-- Live Anwesenheit -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3>👥 Anwesenheit (falls Check-in vorhanden)</h3>
      <div class="row" style="flex:0 0 auto">
        <button class="btn small" id="toggleAnonNames">🙈 Namen ausblenden</button>
        <span class="pill" id="attCountPill">0</span>
      </div>
    </div>
    <div id="attendanceList" class="list" aria-live="polite"></div>
    <div id="manualAttendanceRow" style="margin-top:14px">
      <label for="manualAttendanceName">Teilnehmer manuell hinzufügen</label>
      <div class="row" style="align-items:end">
        <div><input id="manualAttendanceName" placeholder="Vor- und Nachname"></div>
        <div style="flex:0 0 auto"><button class="btn small" id="manualAttendanceAdd">➕ Hinzufügen</button></div>
      </div>
      <p class="status" style="text-align:left">Manuelle Einträge werden mit dem Bericht gespeichert, auch ohne QR-Check-in.</p>
    </div>
  </div>

  <!-- Themen + Notizen (mit Verantwortlichem) -->
  <div class="card">
    <div id="topicAddRow" class="row" style="align-items:flex-end">
      <div style="flex:2">
        <label>Neues Thema hinzufügen</label>
        <input id="topicInput" placeholder="z. B. Tagesordnung, Projektstand oder wichtige Beschlüsse" />
      </div>
      <div style="flex:0 0 auto">
        <button class="btn" id="addTopicBtn">➕ Thema anlegen</button>
      </div>
    </div>

    <div id="topicsWrap" style="display:grid;gap:12px;margin-top:12px"></div>
  </div>

  <!-- To-Dos -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:12px;flex-wrap:wrap">
      <h3>📌 To-dos und Aufgaben</h3>
      <label class="inline-check" style="font-size:13px;color:var(--muted)">
        <input type="checkbox" id="autoSeedNext" checked />
        <span>Offene Aufgaben als Themen in den nächsten Bericht übernehmen</span>
      </label>
    </div>

    <div id="todoAddRow" class="row">
      <input id="todoInput" placeholder="To-Do (Aufgabe)" />
      <input id="todoOwnerInput" placeholder="Verantwortlich (Name)" />
      <button class="btn" id="addTodoBtn">➕ hinzufügen</button>
    </div>

    <div id="nextSessionRow" class="row" style="flex:1 1 100%; margin-top:12px">
      <div>
        <label for="nextSessionSelect">Nächsten Termin für die Übernahme auswählen</label>
        <select id="nextSessionSelect" disabled>
          <option value="">(Bitte Termin wählen)</option>
        </select>
      </div>
      <div style="flex:0 0 auto">
        <label>&nbsp;</label>
        <button class="btn small" id="reloadNextSessionsBtn">🔄 Termine laden</button>
      </div>
    </div>

    <div id="todoList" class="list" style="margin-top:12px"></div>
  </div>

  <!-- Speichern – zentriert -->
  <div class="card">
    <div class="center-actions">
      <button class="btn" id="saveBtn">📤 Speichern</button>
      <span class="status" id="status">Bereit.</span>
    </div>
  </div>
</div>

  <div class="card" id="readActions" style="max-width:1100px;width:calc(100% - 32px);margin:14px auto 90px;padding:16px 18px;position:relative;z-index:1">
    <div class="row" style="align-items:center">
      <label class="inline-check" style="min-width:200px;min-height:42px;font-weight:bold;font-size:15px"><input type="checkbox" id="ackCheckbox" style="width:20px;height:20px;accent-color:#238636"><span>Bericht gelesen</span></label>
      <button class="btn" id="printBtn" type="button">🖨️ Drucken</button>
      <button class="btn ghost" id="designTemplateBtn" type="button" style="display:none">🎨 Design Vorlage</button>
    </div>
    <span id="ackInfo" class="status"></span>
  </div>

<!-- Home-Button -->
<button class="home-btn" onclick="location.href='hauptseite.html'">
  <img src="home.jpg" alt="Home">
</button>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="schullogos.js"></script>
<script>
if (!firebase.apps.length) firebase.initializeApp(window.firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

function preloadAndSet(img, url){const t=new Image();t.onload=()=>img.src=url; t.src=url;}
async function applyHeaderBySchool(school){ return window.applySchoolLogos(school); }
const normalize=r=>{r=(r||'').toLowerCase();
  if(['administrator','admins','adminstrator'].includes(r))r='admin';
  if(['trainer/in','trainerin','coach'].includes(r))r='trainer';
  if(['si-fu','sifu','si fu','si‐fu','si‒fu'].includes(r))r='si-fu';
  return r;
};

const state={canEdit:false,school:null, role:null, topicDb:'—', att:[], manualAttendance:[], hideNames:false, topics:[], todos:[], currentSessionId:null};
function ymd(d){const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}
function todayLocal(){const d=new Date(); d.setHours(0,0,0,0); return d;}
function updateStatus(msg,type){const el=document.getElementById('status'); el.textContent=msg; el.classList.remove('ok','err'); if(type) el.classList.add(type);}
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function endOfDay(d){const x=new Date(d);x.setHours(23,59,59,999);return x}

// neue Struktur: protocols/{school}/dates/{dateKey}
function protocolDocRef(schoolLower, dateKey){
  return db.collection('protocols').doc(schoolLower).collection('dates').doc(dateKey);
}

auth.onAuthStateChanged(async user=>{
  if(!user){location.replace('index.html');return;}
  document.getElementById('app').style.display='block';

  try {
    const org=(sessionStorage.getItem('activeOrganisation')||'').trim();
    const membership=org ? await db.collection('mitgliedschaften').doc(user.uid).collection('organisationen').doc(org).get() : null;
    const legacy=await db.collection('rollen').doc(user.uid).get();
    const ld=legacy.exists?legacy.data():{};
    const isMaster=String(ld.school||'').toUpperCase()==='MASTER' && normalize(ld.role)==='admin';
    const md=membership?.exists?membership.data():null;
    const selected=(sessionStorage.getItem('activeSchool')||'').trim();
    if(!isMaster && (!md || !['gruppe','standort'].includes(md.scope))) throw new Error('Keine gültige Organisationsmitgliedschaft.');
    let allowedSites=[];
    if(!isMaster && md.scope==='standort') allowedSites=[String(md.school||'')];
    else {
      const group=isMaster ? (org && org!=='MASTER'?org:'') : org;
      if(group){
        const groupSnap=await db.collection('Schulen').doc('MASTER').collection('gruppen').doc(group).get();
        const raw=groupSnap.data()?.School;
        allowedSites=(Array.isArray(raw)?raw:[raw]).filter(x=>typeof x==='string'&&x.trim());
      }
    }
    const school=selected || (allowedSites.length===1?allowedSites[0]:'');
    if(!school || school.toUpperCase()==='MASTER' || (!isMaster && !allowedSites.some(x=>x.toLowerCase()===school.toLowerCase()))) throw new Error('Bitte zuerst einen berechtigten Standort auf der Hauptseite auswählen.');
    state.school=school.toUpperCase();
    state.role=isMaster?'admin':normalize(md.role);
    state.canEdit=isMaster || ['admin','si-fu'].includes(state.role);
    if(state.canEdit)document.getElementById('designTemplateBtn').style.display='inline-block';
    document.getElementById('activeRolePill').textContent='Rolle: '+state.role;
    document.getElementById('activeRolePill').style.display='inline-block';
    document.getElementById('activeSchoolPill').textContent='Standort: '+school;
    document.getElementById('activeSchoolPill').style.display='inline-block';
    if(!state.canEdit){
      document.getElementById('topicFromDb').readOnly=true;
      document.getElementById('manualAttendanceRow').style.display='none';
      document.getElementById('topicAddRow').style.display='none';
      document.getElementById('todoAddRow').style.display='none';
      document.getElementById('saveBtn').style.display='none';
      document.getElementById('autoSeedNext').closest('label').style.display='none';
      document.getElementById('nextSessionRow').style.display='none';
      document.getElementById('nextSessionSelect').disabled=true;
      document.getElementById('reloadNextSessionsBtn').style.display='none';
    }
    await applyHeaderBySchool(state.school);
    if(window.orgafunkApplyTheme) await window.orgafunkApplyTheme(state.school);
  } catch(e) {
    document.getElementById('app').innerHTML='<div class="card">'+String(e.message).replaceAll('<','&lt;')+'</div>';
    return;
  }

  initPage().catch(e=>{console.error(e); updateStatus('Fehler beim Initialisieren','err');});
});

/* Datum unabhängig von vorhandenen Trainings frei wählen */
function getSelectedDate(){
  const value=document.getElementById('reportDateInput').value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(value)) return todayLocal();
  const [y,m,d]=value.split('-').map(Number);
  return new Date(y,m-1,d);
}
function getSelectedDateKey(){return ymd(getSelectedDate());}
async function applySelectedSessionFromPicker(){
  state.currentSessionId=null;state.topicDb='—';
  const hit=await findSessionForDate(getSelectedDate(),state.school);
  if(hit){state.currentSessionId=hit.id;state.topicDb=hit.data.topic||'—';}
  document.getElementById('topicFromDb').value=state.topicDb==='—'?'':state.topicDb;
  await loadExistingProtocol();
  startAttendanceListener();
  await refreshAckUI();
}

async function findSessionForDate(date, school){
  const start=startOfDay(date), end=endOfDay(date);
  try{
    const s=await db.collection('sessions')
      .where('school','==',school)
      .where('date','>=',firebase.firestore.Timestamp.fromDate(start))
      .where('date','<=',firebase.firestore.Timestamp.fromDate(end))
      .orderBy('date','asc')
      .limit(3)
      .get();
    if(!s.empty){const doc=s.docs[0]; return {id:doc.id, data:doc.data()};}
  }catch(e){ }
  try{
    const s2=await db.collection('sessions').where('school','==',school).limit(200).get();
    let best=null; s2.forEach(doc=>{const d=doc.data(); const dt=d.date?.toDate?.(); if(!dt) return; if(ymd(dt)===ymd(date)) best={id:doc.id, data:d};});
    if(best) return best;
  }catch(e){ }
  return null;
}

function nextMonday001(base=new Date()){
  const d=new Date(base); const day=(d.getDay()+6)%7; // Mo=0
  const next=new Date(d); next.setDate(d.getDate() + (7 - day));
  next.setHours(0,1,0,0);
  return next;
}

function readAckDocRef_ByNewStructure(emailRaw, schoolUpper, dateKey){
  const schoolLower=(schoolUpper||'').toLowerCase();
  return db.collection('protocols')
    .doc(schoolLower)
    .collection('read')
    .doc(dateKey)
    .collection('byEmail')
    .doc(emailRaw); // E-Mail exakt wie auth.email (case-sensitiv)
}
function ackDocRef_legacy(uid, schoolUpper, dateKey){
  const key = `${(schoolUpper||'').toLowerCase()}_${dateKey}`;
  return db.collection('users').doc(uid).collection('protocolAcks').doc(key);
}

/* ======= Gelesen-Häkchen – UI & Logik ======= */
async function refreshAckUI(){
  const user = auth.currentUser; if(!user) return;
  const cb=document.getElementById('ackCheckbox');
  const info=document.getElementById('ackInfo');
  const email=(user.email||'').trim(); // wichtig: kein toLowerCase()
  const ref=readAckDocRef_ByNewStructure(email, state.school, getSelectedDateKey());
  try{
    const snap=await ref.get();
    let checked=false, expires=null;
    if(snap.exists){
      const d=snap.data()||{};
      expires = d.expiresAt?.toDate?.() || null;
      checked=!!d.read;
    }
    cb.checked=checked;
    info.textContent = checked
      ? 'Gelesen (dauerhaft bestätigt)'
      : 'Noch nicht bestätigt';
    info.className = 'status ' + (checked ? 'ok' : 'err');
  }catch(e){
    console.error('[ack] read error', e);
    cb.checked=false;
    info.textContent = (e?.code === 'permission-denied')
      ? 'Keine Berechtigung, bitte Firestore-Regeln prüfen.'
      : 'Status unbekannt';
    info.className='status';
  }
}

async function saveAck(checked){
  const user = auth.currentUser; if(!user) return;
  const email=(user.email||'').trim();
  const dateKey=getSelectedDateKey();
  const schoolUpper=state.school;

  const refNew = readAckDocRef_ByNewStructure(email, schoolUpper, dateKey);
  const refLegacy = ackDocRef_legacy(user.uid, schoolUpper, dateKey); // optional

  if(checked){
    const payload={
      read:true,
      school:schoolUpper,
      dateKey,
      email,
      setAt:firebase.firestore.FieldValue.serverTimestamp?.() || new Date()
    };
    await refNew.set(payload, { merge:true });
    await refLegacy.set(payload, { merge:true }).catch(()=>{}); // optional
  }else{
    await refNew.delete().catch(()=>{});
    await refLegacy.delete().catch(()=>{}); // optional
  }
  await refreshAckUI();
}


/* Anwesenheit (falls Check-in vorhanden) */
let unsubAtt=null;
function dedupeBy(arr,keyFn){const seen=new Set(); const out=[]; for(const x of arr){const k=keyFn(x); if(seen.has(k)) continue; seen.add(k); out.push(x);} return out;}
function renderAttendance(){
  const wrap=document.getElementById('attendanceList'); wrap.innerHTML='';
  const list=[...(state.att||[]).map(p=>({...p,manual:false})),...(state.manualAttendance||[]).map(p=>({...p,manual:true}))];
  document.getElementById('attCountPill').textContent=list.length;
  if(!list.length){wrap.innerHTML='<span class="status">Keine Anwesenheiten eingetragen.</span>';return;}
  list.forEach((p,idx)=>{
    const left=document.createElement('div');left.className='item';
    const name=document.createElement('span');name.textContent='• '+(state.hideNames?'Teilnehmer':(p.name||'Unbekannt'))+(p.manual?' (manuell)':'');
    left.appendChild(name);
    const right=document.createElement('div');
    if(p.manual&&state.canEdit){
      const btn=document.createElement('button');btn.className='btn small ghost';btn.textContent='Entfernen';
      btn.onclick=()=>{state.manualAttendance.splice(idx-(state.att||[]).length,1);renderAttendance();};
      right.appendChild(btn);
    }
    wrap.appendChild(left);wrap.appendChild(right);
  });
}
function startAttendanceListener(){
  if(typeof unsubAtt==='function'){ try{unsubAtt();}catch{} }
  state.att=[];
  if(!state.currentSessionId){ renderAttendance(); return; }
  try{
    unsubAtt=db.collection('sessions').doc(state.currentSessionId).collection('checkins')
      .orderBy('checkedAt','desc')
      .onSnapshot(s=>{
        const list=[]; s.forEach(doc=>{const d=doc.data()||{}; list.push({name:d.displayName||d.name||'Unbekannt', uid:d.uid||doc.id});});
        state.att=dedupeBy(list,p=>p.uid||p.name); renderAttendance();
      });
  }catch(e){ renderAttendance(); }
}

/* Themen/Notizen (mit Verantwortlichem) */
function createTopicCard(t, idx){
  const card=document.createElement('div'); 
  card.className='topic-card'; 
  card.dataset.idx=idx;
  card.innerHTML=`
    <div class="topic-header">
      <input class="topic-title" placeholder="Thema" value="${(t.title||'').replaceAll('"','&quot;')}">
      <input class="topic-owner" placeholder="Verantwortlich" style="max-width:220px" value="${(t.owner||'').replaceAll('"','&quot;')}">
      <button class="btn small ghost rm">🗑️</button>
    </div>
    <textarea class="topic-notes" placeholder="Notizen…">${(t.notes||'')}</textarea>
  `;
  const titleInput = card.querySelector('.topic-title');
  const ownerInput = card.querySelector('.topic-owner');
  const notesTa    = card.querySelector('.topic-notes');

  titleInput.oninput = (e)=>{ state.topics[idx].title = e.target.value; };
  ownerInput.oninput = (e)=>{ state.topics[idx].owner = e.target.value; };
  notesTa.oninput    = (e)=>{ state.topics[idx].notes = e.target.value; };

  card.querySelector('.rm').onclick=()=>{
    state.topics.splice(idx,1);
    renderTopicsFromState();
  };
  if(!state.canEdit){card.querySelectorAll('input,textarea').forEach(x=>x.readOnly=true);card.querySelector('.rm').remove();}
  return card;
}
function renderTopicsFromState(){
  const wrap=document.getElementById('topicsWrap'); 
  wrap.innerHTML='';
  (state.topics||[]).forEach((t,i)=>{
    wrap.appendChild(createTopicCard(t,i));
  });
}
function addNewTopic(title='', owner=''){
  state.topics.push({title, owner: owner||'', notes:''});
  renderTopicsFromState();
}

/* To-Dos */
function renderTodos(){
  const wrap=document.getElementById('todoList'); wrap.innerHTML='';
  if(!Array.isArray(state.todos) || state.todos.length===0){
    wrap.innerHTML='<span class="status">Noch keine To-Dos.</span>'; return;
  }
  state.todos.forEach((t,idx)=>{
    const rowL=document.createElement('div'); rowL.className='item';
    rowL.innerHTML=`<span>•</span>
      <input class="todo-task" value="${(t.task||'').replaceAll('"','&quot;')}" />
      <span class="status" style="font-size:12px">verantwortlich</span>
      <input class="todo-owner" style="max-width:220px" value="${(t.owner||'').replaceAll('"','&quot;')}" />`;
    const inputs=rowL.querySelectorAll('input');
    const taskInput=inputs[0]; const ownerInput=inputs[1];
    taskInput.addEventListener('input',e=>{ t.task=e.target.value; });
    ownerInput.addEventListener('input',e=>{ t.owner=e.target.value; });
    const rowR=document.createElement('div');
    const del=document.createElement('button'); del.className='btn small ghost'; del.textContent='Löschen';
    del.onclick=()=>{ state.todos.splice(idx,1); renderTodos(); };
    if(state.canEdit)rowR.appendChild(del);
    if(!state.canEdit)rowL.querySelectorAll('input').forEach(x=>x.readOnly=true);
    wrap.appendChild(rowL); wrap.appendChild(rowR);
  });
}
function addTodo(){
  const task=document.getElementById('todoInput').value.trim();
  const owner=document.getElementById('todoOwnerInput').value.trim();
  if(!task) return;
  state.todos.push({task,owner});
  document.getElementById('todoInput').value='';
  document.getElementById('todoOwnerInput').value='';
  renderTodos();
}

/* Bericht laden/speichern */
async function loadExistingProtocol(){
  const schoolLower = state.school.toLowerCase();
  const dateKey = getSelectedDateKey();
  try{
    const snap=await protocolDocRef(schoolLower, dateKey).get();
    if(snap.exists){
      const d=snap.data();
      document.getElementById('topicFromDb').value=d.topicFromDb|| (state.topicDb==='—'?'':state.topicDb);
      state.manualAttendance=Array.isArray(d.manualAttendance)?d.manualAttendance.filter(x=>x&&typeof x.name==='string'):[];
      state.topics=Array.isArray(d.topics)? JSON.parse(JSON.stringify(d.topics)) : [];
      state.todos=Array.isArray(d.todos)? JSON.parse(JSON.stringify(d.todos)) : [];
      renderTopicsFromState(); renderTodos();renderAttendance(); updateStatus('Bericht geladen.','ok');
    } else {
      state.topics=[]; state.todos=[];state.manualAttendance=[]; renderTopicsFromState(); renderTodos();renderAttendance();
      updateStatus('Kein Bericht vorhanden – neu anlegen.');
    }
  }catch(e){ updateStatus('Fehler beim Laden des Berichts','err'); }
}
function normTitle(x){ return (x||'').toString().trim().replace(/\s+/g,' ').toLowerCase(); }

async function saveProtocol(){
  if(!state.canEdit) throw new Error("Keine Bearbeitungsberechtigung");
  updateStatus('Speichere…');
  const schoolLower = state.school.toLowerCase();
  const dateKey=getSelectedDateKey();

  const payload={
    school: schoolLower,
    dateKey,
    sessionId: state.currentSessionId||null,
    topicFromDb: document.getElementById('topicFromDb').value.trim()||null,
    manualAttendance: state.manualAttendance,
    topics: state.topics,
    todos: state.todos,
    attendance: [...state.att,...state.manualAttendance],
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  const seedEnabled=document.getElementById('autoSeedNext').checked && state.todos.length>0;
  const nextKeyCheck=document.getElementById('nextSessionSelect')?.value||'';
  if(seedEnabled && (!nextKeyCheck || nextKeyCheck===dateKey)){
    updateStatus('Bitte einen anderen Folgetermin für die Aufgabenübernahme auswählen oder die Übernahme deaktivieren.','err');return;
  }
  await protocolDocRef(schoolLower, dateKey).set(payload,{merge:true});

  // To-Dos -> nächstes Bericht (ohne Doppel-Themen) – nur wenn Checkbox aktiv
  if(seedEnabled){
    const sel=document.getElementById('nextSessionSelect');
    const nextKey=sel?.value||'';

    if(!nextKey){
      updateStatus('Bitte nächstes Termin auswählen (To-Dos).','err'); return;
    }
    if(nextKey === dateKey){
      updateStatus('„Nächster Termin“ darf nicht dem aktuellen Termin entsprechen. Bitte einen anderen Termin wählen.','err');
      return;
    }

    const nextRef = protocolDocRef(schoolLower, nextKey);

    let existingTopics=[];
    try{
      const nextSnap=await nextRef.get();
      if(nextSnap.exists && Array.isArray(nextSnap.data().topics)){
        existingTopics = nextSnap.data().topics;
      }
    }catch(e){}

    const existSet = new Set(existingTopics.map(t=>normTitle(t?.title)));
    const seed = [];
    (state.todos||[]).forEach(t=>{
      const title = (t.task||'').toString();
      const key = normTitle(title);
      if(!title) return;
      if(existSet.has(key)) return;
      existSet.add(key);
      seed.push({ title, notes:'', owner: t.owner||'' });
    });

    if(seed.length>0){
      await nextRef.set({
        school: schoolLower,
        dateKey: nextKey,
        seedFrom: dateKey,
        topics: firebase.firestore.FieldValue.arrayUnion(...seed),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      },{merge:true});
    }
  }

  updateStatus('Gespeichert.','ok');
}

/* Nächster Termin (Dropdown) */
async function loadUpcomingSessionsForSeeding(fromDate){
  const sel=document.getElementById('nextSessionSelect'); if(!sel) return;
  sel.innerHTML='<option value=\"\">(Lade Termine…)</option>';
  try{
    const from=startOfDay(fromDate);
    let res=null;
    try{
      res = await db.collection('sessions')
        .where('school','==', state.school)
        .where('date','>=', firebase.firestore.Timestamp.fromDate(from))
        .orderBy('date','asc')
        .limit(24)
        .get();
    }catch(e){
      const s2=await db.collection('sessions').where('school','==', state.school).get();
      const rows=[]; s2.forEach(doc=>{ const d=doc.data(); const dt=d.date?.toDate?.(); if(!dt) return; if(dt>=from) rows.push({id:doc.id, data:d, dt}); });
      rows.sort((a,b)=>a.dt-b.dt);
      res={ docs: rows.map(r=>({ id:r.id, data:()=>r.data })) };
    }

    const opts=[];
    res.docs.forEach(doc=>{
      const d=doc.data(); const dt=d.date?.toDate?.(); if(!dt) return;
      const key=ymd(dt); const label=`${dt.toLocaleString()}${d.topic?' — '+d.topic:''}`;
      opts.push({key,label});
    });

    sel.innerHTML='';
    if(opts.length===0){ sel.innerHTML='<option value=\"\">(Keine Termine gefunden)</option>'; sel.disabled=true; }
    else { sel.disabled=false; opts.forEach(o=>{ const op=document.createElement('option'); op.value=o.key; op.textContent=o.label; sel.appendChild(op); }); sel.selectedIndex=0; }

    sel.disabled = !document.getElementById('autoSeedNext').checked || sel.options.length===0;
  }catch(e){
    sel.innerHTML='<option value=\"\">(Fehler beim Laden)</option>'; sel.disabled=true;
  }
}

/* Init & Events */
async function initPage(){
  document.getElementById('manualAttendanceAdd').onclick=()=>{
    if(!state.canEdit)return;const field=document.getElementById('manualAttendanceName');const name=field.value.trim();
    if(!name)return;state.manualAttendance.push({name});field.value='';renderAttendance();
  };
  document.getElementById('manualAttendanceName').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('manualAttendanceAdd').click();}};
  document.getElementById('toggleAnonNames').onclick=()=>{state.hideNames=!state.hideNames; renderAttendance();};
  document.getElementById('addTopicBtn').onclick=()=>{ const v=document.getElementById('topicInput').value.trim(); if(!v) return; addNewTopic(v,''); document.getElementById('topicInput').value=''; };
  document.getElementById('addTodoBtn').onclick=addTodo;
  document.getElementById('todoInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('todoOwnerInput').focus(); }});
  document.getElementById('todoOwnerInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addTodo(); }});
  document.getElementById('saveBtn').onclick=()=>{ saveProtocol().catch(e=>{updateStatus('Fehler: '+e.message,'err');}); };

  document.getElementById('reportDateInput').addEventListener('change',async()=>{
    await applySelectedSessionFromPicker();
    if(state.canEdit) await loadUpcomingSessionsForSeeding(getSelectedDate());
  });
  const requestedDate=new URLSearchParams(location.search).get('datum');
  const validRequestedDate=/^\d{4}-\d{2}-\d{2}$/.test(requestedDate||'');
  document.getElementById('reportDateInput').value=validRequestedDate?requestedDate:ymd(todayLocal());
  try{
    const last=await db.collection('protocols').doc(state.school.toLowerCase()).collection('dates')
      .orderBy(firebase.firestore.FieldPath.documentId()).endAt(ymd(todayLocal())).limitToLast(1).get();
    if(!validRequestedDate && !last.empty) document.getElementById('reportDateInput').value=last.docs[0].id;
  }catch(e){console.warn('Letzter Bericht konnte nicht ermittelt werden:',e);}
  await applySelectedSessionFromPicker();
  if(state.canEdit) await loadUpcomingSessionsForSeeding(getSelectedDate());
  document.getElementById('reloadNextSessionsBtn').onclick=()=>loadUpcomingSessionsForSeeding(getSelectedDate());
  document.getElementById('autoSeedNext').onchange=e=>{
    document.getElementById('nextSessionSelect').disabled=!e.target.checked;
  };
  document.getElementById('ackCheckbox').onchange=e=>saveAck(e.target.checked).catch(err=>{console.error(err);document.getElementById('ackInfo').textContent='Bestätigung konnte nicht gespeichert werden.';});
  document.getElementById('printBtn').onclick=printDesignedReport;
  document.getElementById('designTemplateBtn').onclick=()=>location.href='berichtdesign.html';
}
function escapePrintText(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function reportDesignKey(){return 'orgafunk-report-design:'+String(sessionStorage.getItem('activeOrganisation')||'').toLowerCase()+':'+String(sessionStorage.getItem('activeSchool')||'').toLowerCase();}
async function printDesignedReport(){
  const printBtn=document.getElementById('printBtn');printBtn.disabled=true;
  let design;
  try{
    if(!state.school)throw Error('Kein Standort ausgewählt.');
    const snap=await db.collection('berichtvorlagen').doc(state.school.toLowerCase()).get();
    if(!snap.exists){alert('Für diesen Standort wurde noch keine Druckvorlage in Firestore gespeichert. Bitte einen Administrator bitten, die Vorlage im Designer zu speichern.');return;}
    design=snap.data();
    if(design.format!=='orgafunk-berichtdesign')throw Error('Unbekanntes Vorlagenformat.');
  }catch(e){console.error('Druckvorlage laden',e);alert('Druckvorlage konnte nicht geladen werden: '+(e.code==='permission-denied'?'Keine Berechtigung. Bitte Firestore-Regeln prüfen.':e.message));return;}
  finally{printBtn.disabled=false;}
  const color=/^#[0-9a-f]{6}$/i.test(design?.accent||'')?design.accent:'#2864a4';
  const font=['Arial, sans-serif','Georgia, serif','Verdana, sans-serif'].includes(design?.font)?design.font:'Arial, sans-serif';
  const date=document.getElementById('reportDateInput').value||'';
  const org=sessionStorage.getItem('activeOrganisation')||'Organisation';
  const school=sessionStorage.getItem('activeSchool')||state.school||'Standort';
  const title=document.getElementById('topicFromDb').value||'Besprechung';
  const attendees=[...(state.att||[]),...(state.manualAttendance||[])].map(x=>x.name||'').filter(Boolean);
  const topics=(state.topics||[]).map(x=>`<section class="topic"><h3>${escapePrintText(x.title||'Thema')}</h3>${x.owner?`<p class="owner">Verantwortlich: ${escapePrintText(x.owner)}</p>`:''}<p class="notes">${escapePrintText(x.notes||'').replace(/\n/g,'<br>')}</p></section>`).join('')||'<p>Keine Themen eingetragen.</p>';
  const todos=(state.todos||[]).map(x=>`<tr><td>${escapePrintText(x.task)}</td><td>${escapePrintText(x.owner)}</td></tr>`).join('');
  // Auch eigene Logos und alle drei Headerlogos erlauben. Relative Bildpfade
  // auf die URL der Berichtsseite auflösen, nicht auf das leere Druck-iframe.
  const logos=(design?.elements||[]).filter(x=>x&&typeof x.src==='string'&&x.src.trim()).map(x=>{
    const raw=x.src.trim();
    const src=/^data:image\/(png|jpeg|webp|svg\+xml)[;,]/i.test(raw)
      ? raw : new URL(raw, document.baseURI).href;
    if(!/^data:image\/|^(https?:|file:)\/\//i.test(src)) return '';

    const v=k=>Math.max(0,Math.min(297,Number(x[k])||0));
    return `<img class="logo" src="${escapePrintText(src)}" style="left:${v('x')}mm;top:${v('y')}mm;width:${Math.min(210,v('w'))}mm;height:${Math.min(297,v('h'))}mm">`;
  }).join('');
  const html=`<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Bericht ${escapePrintText(date)}</title><style>
  @page{size:A4;margin:0}*{box-sizing:border-box;print-color-adjust:exact;-webkit-print-color-adjust:exact}html,body{margin:0;background:#fff;color:#192a3d;font-family:${font}}.page{position:relative;width:210mm;min-height:297mm;padding:49mm 17mm 24mm;}.logo{position:absolute;object-fit:contain;z-index:2}.body{position:relative;z-index:1}h1{font-size:23px;margin:0 0 10px}h2{font-size:15px;margin:20px 0 8px}h3{font-size:12px;margin:10px 0 4px}p,td,th{font-size:11px;line-height:1.5}.meta{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11px;margin:10px 0 22px}.line{height:2px;background:${color}}.topic{break-inside:avoid}.notes{white-space:normal}.owner{font-size:10px;color:#56677a}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #d7e0e9;padding:7px 4px;vertical-align:top}footer{margin-top:25mm;padding-top:6px;border-top:1px solid #d7e0e9;color:#64748b;font-size:10px;break-inside:avoid}@media print{.page{width:210mm;min-height:297mm}} </style></head><body><article class="page">${logos}<div class="body"><h1>Besprechungsprotokoll</h1><div class="line"></div><div class="meta"><div><b>Datum:</b> ${escapePrintText(date)}</div><div><b>Standort:</b> ${escapePrintText(school)}</div><div style="grid-column:1/-1"><b>Thema:</b> ${escapePrintText(title)}</div></div><h2>1. Anwesenheit</h2><p>${attendees.length?attendees.map(escapePrintText).join(' · '):'Keine Teilnehmer eingetragen.'}</p><h2>2. Besprochene Themen</h2>${topics}<h2>3. To-dos und Aufgaben</h2>${todos?`<table><thead><tr><th>Aufgabe</th><th>Verantwortlich</th></tr></thead><tbody>${todos}</tbody></table>`:'<p>Keine Aufgaben eingetragen.</p>'}<footer>${escapePrintText(org)} · ${escapePrintText(school)} - Bericht</footer></div></article></body></html>`;
  const frame=document.createElement('iframe');frame.style.cssText='position:fixed;left:-10000px;top:0;width:1px;height:1px;border:0';document.body.appendChild(frame);
  frame.contentDocument.open();frame.contentDocument.write(html);frame.contentDocument.close();
  // Vor dem Druck sicherstellen, dass Logos vollständig geladen sind.
  const imgs=[...frame.contentDocument.images];
  const loaded=Promise.all(imgs.map(img=>new Promise(resolve=>{
    if(img.complete){resolve(img.naturalWidth>0);return;}
    img.addEventListener('load',()=>resolve(true),{once:true});
    img.addEventListener('error',()=>resolve(false),{once:true});
  })));
  frame.contentWindow.addEventListener('afterprint',()=>setTimeout(()=>frame.remove(),1500),{once:true});
  Promise.race([loaded,new Promise(resolve=>setTimeout(()=>resolve(null),5000))]).then(results=>{
    if(Array.isArray(results)&&results.some(ok=>!ok)) alert('Mindestens ein Logo konnte nicht geladen werden. Bitte Bildpfade und Vorlage prüfen.');
    frame.contentWindow.focus();frame.contentWindow.print();
    setTimeout(()=>frame.isConnected&&frame.remove(),60000);
  });
}
