<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="branding-layout.css"><style>
:root{--bg:#000;--text:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:16px Arial,sans-serif}main{width:min(1050px,100%);margin:auto;padding:28px 18px 100px;flex:1}h1{margin-top:0}.muted{opacity:.8}.panel{border:1px solid #777;border-radius:12px;padding:18px;margin:14px 0}label{display:block;margin:14px 0}input,select{display:block;width:100%;padding:11px;margin-top:6px;border-radius:7px;border:1px solid #aaa;font:inherit}.btn{display:inline-block;padding:11px 16px;border:1px solid #999;border-radius:8px;background:#fff;color:#000;cursor:pointer;font:inherit;text-decoration:none;margin:6px 6px 6px 0}.btn.secondary{background:transparent;color:var(--text)}.home-btn{position:fixed;bottom:18px;left:18px;background:white;border:0;border-radius:50%;padding:10px;cursor:pointer}.home-btn img{width:32px;height:32px;display:block}[hidden]{display:none!important}iframe{width:100%;height:70vh;border:1px solid #555;border-radius:10px;background:white}p{line-height:1.5}
</style></head><body><main><h1>Seite hinzufügen</h1><p class="muted">Gruppenweite Seiten · nur Gruppenadministratoren und Master</p><p id="status">Berechtigung wird geprüft …</p><section id="area" hidden><form id="form" class="panel"><h2 id="formTitle">Neue Seite</h2><label>Seitenname<input id="name" maxlength="90" required placeholder="Unsere Lernmaterialien"></label><label>Seitentyp<select id="type"><option value="cloud">Cloud-Speicher (Google Drive / OneDrive)</option><option value="website">Externe Webseite</option><option value="gallery">Bildergalerie</option></select></label><label id="displayModeField" hidden>Webseite öffnen<select id="displayMode"><option value="embed">In OrgaFunk einbetten (iframe)</option><option value="external">Direkt in neuem Tab öffnen</option></select></label><label id="urlField">Link (HTTPS)<input id="url" type="url" required placeholder="https://..."></label><label>Reihenfolge<input id="order" type="number" min="0" max="9999" value="100"></label><button class="btn" type="submit" id="save">Seite speichern</button><button class="btn secondary" type="button" id="resetFormBtn">Abbrechen / Neu</button></form><h2>Bereits angelegte Seiten</h2><div id="list"></div></section></main><button class="home-btn" onclick="location.href='hauptseite.html'" aria-label="Zur Hauptseite"><img src="home.jpg" alt="Home"></button><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="schullogos.js"></script><script>if(!firebase.apps.length)firebase.initializeApp(window.firebaseConfig);const auth=firebase.auth(), db=firebase.firestore();
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const group=(params.get('gruppe')||'').trim();
async function groupRights(user,g){
 if(!user||!g)return {read:false,admin:false};
 const r=await db.collection('rollen').doc(user.uid).get();const d=r.data()||{};
 if(d.school==='MASTER'&&String(d.role).toLowerCase()==='admin')return {read:true,admin:true};
 const m=await db.collection('mitgliedschaften').doc(user.uid).collection('organisationen').doc(g).get();
 if(m.exists){const x=m.data();const groupDoc=await db.collection('Schulen').doc('MASTER').collection('gruppen').doc(g).get();const sites=groupDoc.data()?.School||[];const siteList=Array.isArray(sites)?sites:[sites];const valid=x.scope==='gruppe'&&x.school===g||x.scope==='standort'&&siteList.includes(x.school);return {read:valid,admin:valid&&x.scope==='gruppe'&&['admin','si-fu'].includes(x.role)}}
 const groupDoc=await db.collection('Schulen').doc('MASTER').collection('gruppen').doc(g).get();const sites=groupDoc.data()?.School||[];const siteList=Array.isArray(sites)?sites:[sites];return {read:d.school===g||siteList.includes(d.school),admin:d.school===g&&['admin','si-fu'].includes(d.role)};
}

let editId=null;
function validUrl(s){try{const u=new URL(s);return u.protocol==='https:'&&!!u.hostname}catch{return false}}
function updateModeField(){const t=$('type').value;$('displayModeField').hidden=t!=='website';$('urlField').hidden=t==='gallery';$('url').required=t!=='gallery'}
$('type').addEventListener('change',updateModeField);
function reset(){editId=null;$('form').reset();$('formTitle').textContent='Neue Seite';updateModeField()}
async function refresh(){const snap=await db.collection('eigeneSeiten').doc(group).collection('seiten').get();$('list').replaceChildren();for(const doc of snap.docs){const d=doc.data(),row=document.createElement('div');row.className='panel';const label=document.createElement('strong');label.textContent=d.name+' ('+(d.type==='cloud'?'Cloud':d.type==='gallery'?'Galerie':'Webseite')+')';row.append(label,document.createElement('br'));const edit=document.createElement('button');edit.className='btn secondary';edit.textContent='Bearbeiten';edit.onclick=()=>{editId=doc.id;for(const k of ['name','type','url','order'])$(k).value=d[k]??'';$('displayMode').value=d.displayMode==='external'?'external':'embed';updateModeField();$('formTitle').textContent='Seite bearbeiten';window.scrollTo(0,0)};const del=document.createElement('button');del.className='btn secondary';del.textContent='Löschen';del.onclick=async()=>{if(confirm('Seite „'+d.name+'“ wirklich löschen?')){if(d.type==='gallery'){const imgs=await doc.ref.collection('bilder').get();const batch=db.batch();imgs.docs.forEach(x=>batch.delete(x.ref));batch.delete(doc.ref);await batch.commit()}else await doc.ref.delete();refresh()}};if(d.type==='gallery'){const gallery=document.createElement('a');gallery.className='btn';gallery.textContent='Galerie verwalten';gallery.href='customseite.html?gruppe='+encodeURIComponent(group)+'&seite='+encodeURIComponent(doc.id);row.append(gallery)}row.append(edit,del);$('list').append(row)}}
auth.onAuthStateChanged(async user=>{if(!user){location.replace('index.html');return}try{const rights=await groupRights(user,group);if(!rights.admin){$('status').textContent='Keine Berechtigung zur Seitenverwaltung.';return}$('status').hidden=true;$('area').hidden=false;await refresh()}catch(e){$('status').textContent='Berechtigung konnte nicht geprüft werden: '+e.message}});
$('resetFormBtn').onclick=reset;updateModeField();
$('form').onsubmit=async e=>{e.preventDefault();const name=$('name').value.trim(),url=$('url').value.trim(),type=$('type').value,order=Number($('order').value);if((type!=='gallery'&&!validUrl(url))||!name||!['cloud','website','gallery'].includes(type)||order<0||order>9999){alert('Bitte Name, gegebenenfalls HTTPS-Link und Reihenfolge prüfen.');return}const data={name,url:type==='gallery'?'':url,type,displayMode:type==='website'&&$('displayMode').value==='external'?'external':'embed',order,aktiv:true,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:auth.currentUser.uid};$('save').disabled=true;try{const col=db.collection('eigeneSeiten').doc(group).collection('seiten');if(editId)await col.doc(editId).update(data);else await col.add(data);reset();await refresh()}catch(err){alert('Speichern fehlgeschlagen: '+err.message)}finally{$('save').disabled=false}};
</script><script src="branding-layout.js"></script></body></html>
