<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="branding-layout.css"><style>
:root{--bg:#000;--text:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:16px Arial,sans-serif}main{width:min(1050px,100%);margin:auto;padding:28px 18px 100px;flex:1}h1{margin-top:0}.muted{opacity:.8}.panel{border:1px solid #777;border-radius:12px;padding:18px;margin:14px 0}label{display:block;margin:14px 0}input,select{display:block;width:100%;padding:11px;margin-top:6px;border-radius:7px;border:1px solid #aaa;font:inherit}.btn{display:inline-block;padding:11px 16px;border:1px solid #999;border-radius:8px;background:#fff;color:#000;cursor:pointer;font:inherit;text-decoration:none;margin:6px 6px 6px 0}.btn.secondary{background:transparent;color:var(--text)}.home-btn{position:fixed;bottom:18px;left:18px;background:white;border:0;border-radius:50%;padding:10px;cursor:pointer}.home-btn img{width:32px;height:32px;display:block}[hidden]{display:none!important}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin:20px 0}.gallery figure{margin:0;border:1px solid #777;border-radius:12px;padding:10px;min-width:0}.gallery img{width:100%;height:190px;object-fit:contain;border-radius:8px;background:#222;cursor:zoom-in}.gallery figcaption{padding:8px 2px;overflow-wrap:anywhere}.gallery figure button{margin-top:8px}.upload-panel{margin:18px 0}.upload-panel input{margin:8px 0}.gallery-dialog{max-width:95vw;max-height:95vh;background:#111;color:white;border:1px solid #777;border-radius:12px}.gallery-dialog img{max-width:88vw;max-height:75vh;object-fit:contain}.gallery-dialog p{text-align:center}[hidden]{display:none!important}iframe{width:100%;height:70vh;border:1px solid #555;border-radius:10px;background:white}p{line-height:1.5}
</style></head><body><main><h1 id="title">Seite wird geladen …</h1><p id="status">Berechtigung wird geprüft …</p><div id="content" hidden><div id="embedded"></div><section id="galleryArea" hidden><div id="galleryAdmin" class="panel upload-panel" hidden><h2>Bilder verwalten</h2><p class="muted">JPG, PNG oder WebP auswählen. Bilder werden automatisch verkleinert und komprimiert (maximal 40 Bilder).</p><label>Bild auswählen<input id="galleryFile" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Bildtitel (optional)<input id="galleryCaption" maxlength="120" placeholder="Beschreibung des Bildes"></label><button id="galleryUpload" class="btn" type="button">Bild hochladen</button><p id="galleryMessage" role="status"></p></div><p id="galleryEmpty" class="muted"></p><div id="galleryGrid" class="gallery"></div></section><div id="external" class="panel" hidden><p id="explain"></p><a id="open" class="btn" target="_blank" rel="noopener noreferrer">In neuem Tab öffnen</a></div></div></main><dialog id="galleryLightbox" class="gallery-dialog"><button type="button" class="btn" id="galleryClose">Schließen</button><div><img id="galleryLarge" alt="Vergrößertes Bild"></div><p id="galleryLargeCaption"></p></dialog><button class="home-btn" onclick="location.href='hauptseite.html'" aria-label="Zur Hauptseite"><img src="home.jpg" alt="Home"></button><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="schullogos.js"></script><script>if(!firebase.apps.length)firebase.initializeApp(window.firebaseConfig);const auth=firebase.auth(), db=firebase.firestore();
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const group=(params.get('gruppe')||'').trim();
async function groupRights(user,g){
 if(!user||!g)return {read:false,admin:false};
 const r=await db.collection('rollen').doc(user.uid).get();const d=r.data()||{};
 if(d.school==='MASTER'&&String(d.role).toLowerCase()==='admin')return {read:true,admin:true};
 const m=await db.collection('mitgliedschaften').doc(user.uid).collection('organisationen').doc(g).get();
 if(m.exists){const x=m.data();const groupDoc=await db.collection('Schulen').doc('MASTER').collection('gruppen').doc(g).get();const sites=groupDoc.data()?.School||[];const siteList=Array.isArray(sites)?sites:[sites];const valid=x.scope==='gruppe'&&x.school===g||x.scope==='standort'&&siteList.includes(x.school);return {read:valid,admin:valid&&x.scope==='gruppe'&&['admin','si-fu'].includes(x.role)}}
 const groupDoc=await db.collection('Schulen').doc('MASTER').collection('gruppen').doc(g).get();const sites=groupDoc.data()?.School||[];const siteList=Array.isArray(sites)?sites:[sites];return {read:d.school===g||siteList.includes(d.school),admin:d.school===g&&['admin','si-fu'].includes(d.role)};
}

function safe(s){try{const u=new URL(s);return u.protocol==='https:'?u:null}catch{return null}}
function googleEmbed(u){if(!/(^|\.)drive\.google\.com$/i.test(u.hostname))return null;let id='';if(u.pathname==='/drive/folders/'||u.pathname.startsWith('/drive/folders/'))id=u.pathname.split('/')[3]||'';else if(u.pathname.startsWith('/folderview'))id=u.searchParams.get('id')||'';if(!/^[a-zA-Z0-9_-]{10,}$/.test(id))return null;return 'https://drive.google.com/embeddedfolderview?id='+encodeURIComponent(id)+'#list'}
const MAX_GALLERY_IMAGES=40;
function imageToWebp(file){return new Promise((resolve,reject)=>{
 if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>15*1024*1024){reject(new Error('Bitte JPG, PNG oder WebP bis 15 MB auswählen.'));return}
 const img=new Image(),objectUrl=URL.createObjectURL(file);
 img.onload=()=>{try{const scale=Math.min(1,1200/img.naturalWidth,1200/img.naturalHeight);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);let data='';for(const q of [.78,.65,.5,.38,.25]){data=c.toDataURL('image/webp',q);if(data.length<=190000)break}URL.revokeObjectURL(objectUrl);if(!data.startsWith('data:image/webp;base64,')||data.length>190000)reject(new Error('Das Bild ist nach der Komprimierung noch zu groß.'));else resolve(data)}catch(e){URL.revokeObjectURL(objectUrl);reject(e)}};
 img.onerror=()=>{URL.revokeObjectURL(objectUrl);reject(new Error('Bild konnte nicht gelesen werden.'))};img.src=objectUrl;
})}
async function showGallery(pageRef,admin){
 $('galleryArea').hidden=false;$('galleryAdmin').hidden=!admin;
 const grid=$('galleryGrid'),message=$('galleryMessage');
 async function refreshGallery(){const snap=await pageRef.collection('bilder').get();grid.replaceChildren();const docs=snap.docs.sort((a,b)=>(a.data().createdAt?.toMillis?.()||0)-(b.data().createdAt?.toMillis?.()||0));$('galleryEmpty').textContent=docs.length?'':'In dieser Galerie sind noch keine Bilder hinterlegt.';
  for(const doc of docs){const d=doc.data(),figure=document.createElement('figure'),img=document.createElement('img');img.src=d.image;img.alt=d.caption||'Galeriebild';img.loading='lazy';img.onclick=()=>{$('galleryLarge').src=d.image;$('galleryLargeCaption').textContent=d.caption||'';$('galleryLightbox').showModal()};figure.append(img);if(d.caption){const caption=document.createElement('figcaption');caption.textContent=d.caption;figure.append(caption)}if(admin){const del=document.createElement('button');del.className='btn secondary';del.textContent='Bild löschen';del.onclick=async()=>{if(!confirm('Dieses Bild wirklich löschen?'))return;try{await doc.ref.delete();await refreshGallery()}catch(e){alert('Löschen fehlgeschlagen: '+e.message)}};figure.append(del)}grid.append(figure)}return docs.length;
 }
 $('galleryClose').onclick=()=>$('galleryLightbox').close();
 $('galleryUpload').onclick=async()=>{if(!admin)return;const file=$('galleryFile').files[0];if(!file){message.textContent='Bitte ein Bild auswählen.';return}const btn=$('galleryUpload');btn.disabled=true;message.textContent='Bild wird verarbeitet …';try{const count=await refreshGallery();if(count>=MAX_GALLERY_IMAGES)throw new Error('Maximal 40 Bilder pro Galerie.');const image=await imageToWebp(file);await pageRef.collection('bilder').add({image,caption:$('galleryCaption').value.trim(),createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:auth.currentUser.uid});$('galleryFile').value='';$('galleryCaption').value='';message.textContent='Bild gespeichert.';await refreshGallery()}catch(e){message.textContent='Upload fehlgeschlagen: '+e.message}finally{btn.disabled=false}};
 await refreshGallery();
}

auth.onAuthStateChanged(async user=>{if(!user){location.replace('index.html');return}try{const rights=await groupRights(user,group);if(!rights.read){$('status').textContent='Du bist nicht berechtigt, diese Seite zu sehen.';return}const id=params.get('seite')||'';if(!id){$('status').textContent='Keine Seite ausgewählt.';return}const doc=await db.collection('eigeneSeiten').doc(group).collection('seiten').doc(id).get();if(!doc.exists||doc.data().aktiv===false){$('status').textContent='Seite nicht gefunden.';return}const d=doc.data(),u=safe(d.url);if(d.type!=='gallery'&&!u){$('status').textContent='Ungültiger Link.';return}$('title').textContent=d.name;$('status').hidden=true;$('content').hidden=false;if(d.type==='gallery'){await showGallery(doc.ref,rights.admin);if(window.orgafunkApplyTheme)window.orgafunkApplyTheme(sessionStorage.getItem('activeSchool')||'');return}let embedded=null;if(d.type==='cloud')embedded=googleEmbed(u);else if(d.type==='website'&&d.displayMode!=='external')embedded=u.href;if(embedded){const frame=document.createElement('iframe');frame.src=embedded;frame.title=d.name;frame.referrerPolicy='no-referrer';$('embedded').append(frame)}else{$('external').hidden=false;$('explain').textContent=d.type==='website'?'Diese Webseite wird wie eingestellt in einem neuen Tab geöffnet.':'Dieser Cloud-Anbieter erlaubt die Einbettung nicht zuverlässig. Öffne den Ordner im neuen Tab.'}$('open').href=u.href;if(embedded){const p=document.createElement('p');p.textContent='Falls die Einbettung blockiert wird:';p.className='muted';$('embedded').append(p);$('external').hidden=false;$('explain').hidden=true}if(window.orgafunkApplyTheme)window.orgafunkApplyTheme(sessionStorage.getItem('activeSchool')||'');}catch(e){$('status').textContent='Seite konnte nicht geladen werden. Bitte Zugriffsrechte prüfen.';console.error(e)}});
</script><script src="branding-layout.js"></script></body></html>
