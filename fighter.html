<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Videos 2</title>

  <style>
    :root {
      --bg: #000;
      --text: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;

      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 12px 16px;
      gap: 12px;
    }

    .header img {
      height: 80px;
      width: auto;
      object-fit: contain;
    }


    @media (max-width: 750px) {

      .header img {
        height: 44px;
      }

    }


    @media (max-width: 480px) {

      .header img {
        height: 40px;
      }

    }


    /* =====================================================
       HAUPTINHALT
       ===================================================== */

    .wrap {
      width: 100%;
      max-width: 1100px;

      margin: 24px auto;

      padding: 0 12px;
    }


    h1 {
      font-size: 22px;

      margin: 0 0 12px;
    }


    /* =====================================================
       GOOGLE DRIVE FRAME
       ===================================================== */

    .frame {
      width: 100%;
      height: 78vh;

      border: 0;
      border-radius: 10px;

      background: #111;

      box-shadow:
        0 4px 16px
        rgba(0, 0, 0, 0.35);
    }


    .note {
      opacity: 0.85;

      font-size: 14px;

      margin-top: 8px;
    }


    .err {
      color: #ff9c9c;
    }


    /* =====================================================
       HOME BUTTON
       ===================================================== */

    .home-btn {
      position: fixed;

      left: 18px;
      bottom: 18px;

      border: none;

      background: #fff;
      color: #000;

      border-radius: 50%;

      padding: 10px;

      cursor: pointer;

      box-shadow:
        0 2px 6px
        rgba(0, 0, 0, 0.35);
    }


    .home-btn img {
      width: 32px;
      height: 32px;

      display: block;
    }

  </style>
  <link rel="stylesheet" href="branding-layout.css">
</head>


<body>


  <!-- =====================================================
       HEADER
       ===================================================== -->



  <!-- =====================================================
       INHALT
       ===================================================== -->

  <div class="wrap">

    <h1 id="title">
      Videos 2
    </h1>


    <iframe
      id="fighterFrame"
      class="frame"
      title="Fighter Trainingsvideos"
      allowfullscreen>
    </iframe>


    <div
      id="msg"
      class="note">
    </div>

  </div>



  <!-- =====================================================
       HOME BUTTON
       ===================================================== -->

  <button
    class="home-btn"
    onclick="location.href='hauptseite.html'"
    title="Zur Hauptseite">

    <img
      src="home.jpg"
      alt="Home"
    >

  </button>



  <!-- =====================================================
       FIREBASE
       ===================================================== -->

  <script
    src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js">
  </script>

  <script
    src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js">
  </script>

  <script
    src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js">
  </script>


  <script src="firebase-config.js"></script>




  <script>
if (!firebase.apps.length) firebase.initializeApp(window.firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
async function resolveSchool(user){
  let school=(sessionStorage.getItem('activeSchool')||sessionStorage.getItem('school')||'').trim().toLowerCase();
  if(!school){ const role=await db.collection('rollen').doc(user.uid).get(); school=String(role.data()?.school||'').trim().toLowerCase(); }
  return school||'master';
}
async function getLink(school){
  const variants=[school,school.toUpperCase(),school.charAt(0).toUpperCase()+school.slice(1)];
  for(const id of [...new Set(variants)]){
    const snap=await db.collection('links').doc(id).get();
    if(snap.exists){ const data=snap.data()||{}; const keys=['videos2'];
      for(const key of keys){ if(typeof data[key]==='string' && data[key].trim()) return data[key].trim(); }
    }
  }
  return '';
}
function embedUrl(value){
  const url=new URL(value);
  if(url.protocol!=='https:' || !['drive.google.com','docs.google.com'].includes(url.hostname)) throw Error('Bitte einen gültigen Google-Drive-Link eintragen.');
  const match=url.pathname.match(/\/folders\/([a-zA-Z0-9_-]+)/);
  if(match) return 'https://drive.google.com/embeddedfolderview?id='+encodeURIComponent(match[1])+'#grid';
  const file=url.pathname.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(file) return 'https://drive.google.com/file/d/'+encodeURIComponent(file[1])+'/preview';
  if(url.pathname==='/embeddedfolderview' && url.searchParams.get('id'))return value;
  return value;
}
auth.onAuthStateChanged(async user=>{
  if(!user){ location.href='index.html'; return; }
  const frame=document.getElementById('fighterFrame');
  try{
    const school=await resolveSchool(user);
    const link=await getLink(school);
    if(!link){ location.href='dokumente-hilfe.html?bereich=videos2'; return; }
    frame.src=embedUrl(link);
  }catch(error){
    console.error('[videos2]',error);
    frame.style.display='none';
    const msg=document.createElement('p');msg.textContent='Die Ablage konnte nicht geladen werden: '+error.message;
    frame.parentElement.appendChild(msg);
  }
});
</script>


  <script src="branding-layout.js"></script>
</body>

</html>
