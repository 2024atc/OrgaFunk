<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standortübersicht | OrgaFunk</title><link rel="stylesheet" href="branding-layout.css">
<style>
:root{--bg:#000;--text:#fff;--accent-bg:#fff;--accent-text:#000}*{box-sizing:border-box}
[hidden]{display:none!important}body{margin:0;min-height:100vh;display:flex;flex-direction:column;font:16px Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}main{width:min(1160px,100%);margin:0 auto;padding:24px 16px 100px;flex:1}h1{margin:0 0 6px}.muted{opacity:.8}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:20px 0}.btn{border:1px solid #999;border-radius:9px;background:var(--accent-bg);color:var(--accent-text);padding:10px 14px;font:inherit;cursor:pointer}.btn.secondary{background:transparent;color:var(--text)}.btn:disabled{opacity:.5;cursor:not-allowed}.plan{position:relative;width:100%;max-width:1050px;margin:auto;background:#fff;border-radius:12px;overflow:hidden;touch-action:pan-y;box-shadow:0 4px 16px #0005}.plan img{display:block;width:100%;height:auto;user-select:none;pointer-events:none}.pin{position:absolute;left:50%;top:50%;width:23px;height:23px;background:#2ecc71;border:2px solid #11633c;border-radius:5px;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff9,0 2px 9px #0009;cursor:pointer;touch-action:none}.pin.active{z-index:3;outline:3px solid #fff;outline-offset:2px}.pin:focus-visible{outline:3px solid #ff8c00}.below{display:grid;grid-template-columns:minmax(220px,1fr) minmax(230px,2fr);gap:20px;margin-top:20px}.panel{border:1px solid #8886;border-radius:12px;padding:16px}.entries{display:grid;gap:8px}.entry{display:flex;justify-content:space-between;align-items:center;gap:8px}.entry button{flex:1;text-align:left}.entry button.selected{background:var(--accent-bg)!important;color:var(--accent-text)!important;border:3px solid #e6a700!important;box-shadow:0 0 0 2px #e6a70055;font-weight:700}.entry button.selected::before{content:"✓ ";font-weight:900}.small{font-size:13px}.home-btn{position:fixed;bottom:18px;left:18px;border:0;border-radius:50%;background:white;padding:10px;cursor:pointer;z-index:10}.home-btn img{width:32px;height:32px;display:block}dialog{width:min(460px,calc(100% - 24px));background:var(--bg);color:var(--text);border:1px solid #999;border-radius:12px;padding:22px}dialog::backdrop{background:#000b}form{display:grid;gap:12px}label{display:grid;gap:6px}input{width:100%;font:inherit;padding:10px;border-radius:7px;border:1px solid #999}.form-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}#preview{width:min(250px,100%);max-height:150px;object-fit:contain;background:#fff}#status{min-height:22px}@media(max-width:700px){.below{grid-template-columns:1fr}.pin{width:26px;height:26px}}
</style></head><body>
<main><h1>Standortübersicht</h1><p id="scope" class="muted">Standort wird ermittelt …</p><p id="status" role="status">Grundriss wird geladen …</p>
<div id="adminTools" class="toolbar" hidden><label class="btn" style="display:inline-block">Grundriss hochladen <input id="planFile" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><button class="btn" id="add" type="button">+ Punkt hinzufügen</button><span class="small muted">Punkte mit Maus oder Finger verschieben und automatisch speichern.</span></div>
<div id="plan" class="plan" hidden><img id="planImg" alt="Grundriss des Standorts" draggable="false"></div>
<div class="below"><section class="panel"><h2>Gegenstände</h2><div id="entries" class="entries"></div></section><section class="panel"><h2 id="detailsTitle">Positionen</h2><p id="details" class="muted">Wähle unten einen Gegenstand, um seine Position im Plan anzuzeigen.</p><div id="editActions" class="toolbar" hidden><button class="btn secondary" id="rename">Name, Farbe und Größe bearbeiten</button><button class="btn secondary" id="delete">Punkt löschen</button></div></section></div></main>
<button class="home-btn" onclick="location.href='hauptseite.html'" aria-label="Zur Hauptseite"><img src="home.jpg" alt="Home"></button>
<dialog id="editor"><form id="pointForm"><h2 id="editorTitle">Punkt hinzufügen</h2><label>Bezeichnung *<input id="pointName" maxlength="120" required placeholder="z. B. Feuerlöscher"></label><label>Farbe der Markierung <input id="pointColor" type="color" value="#2ecc71" style="height:46px;padding:4px;cursor:pointer"></label><label>Größe der Markierung (Pixel) <input id="pointSize" type="number" min="8" max="100" step="1" value="23" required></label><div class="form-actions"><button class="btn secondary" type="button" id="cancel">Abbrechen</button><button class="btn" type="submit" id="savePoint">Speichern</button></div></form></dialog>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="schullogos.js"></script>
<script>
if(!firebase.apps.length)firebase.initializeApp(window.firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);let school='',canEdit=false,points=[],selected='',editing=false,busy=false;
const clean=s=>String(s||'').trim();const pointColor=d=>/^#[0-9a-fA-F]{6}$/.test(d?.color||'')?d.color:'#2ecc71';const pointSize=d=>Number.isFinite(Number(d?.size))?Math.max(8,Math.min(100,Math.round(Number(d.size)))):23;const status=s=>$('status').textContent=s;
function pointCol(){return db.collection('standortuebersicht').doc(school).collection('punkte')}
function selectPoint(id){selected=id;const p=points.find(x=>x.id===id);$('detailsTitle').textContent=p?p.data().name:'Positionen';$('details').textContent=p?(canEdit?'Klicke auf das Quadrat, um Name, Farbe oder Größe zu bearbeiten. Ziehe es, um die Position zu ändern.':'Das farbige Quadrat zeigt die Position im Grundriss.'):'Wähle unten einen Gegenstand, um seine Position im Plan anzuzeigen.';$('editActions').hidden=!canEdit||!p;render()}
function render(){const plan=$('plan'),list=$('entries');plan.querySelectorAll('.pin').forEach(n=>n.remove());list.replaceChildren();if(!points.length){const p=document.createElement('p');p.className='muted';p.textContent='Noch keine Punkte hinterlegt.';list.append(p)}for(const p of points){const d=p.data();if(p.id===selected){const pin=document.createElement('button');pin.type='button';pin.className='pin'+(p.id===selected?' active':'');pin.style.left=d.x+'%';pin.style.top=d.y+'%';pin.style.setProperty('width',pointSize(d)+'px','important');pin.style.setProperty('height',pointSize(d)+'px','important');pin.style.setProperty('padding','0','important');pin.style.setProperty('background-color',pointColor(d),'important');pin.style.setProperty('background',pointColor(d),'important');pin.style.setProperty('border-color','#222','important');pin.style.setProperty('border-style','solid','important');pin.style.setProperty('border-width','2px','important');const fill=document.createElement('span');fill.setAttribute('aria-hidden','true');fill.style.cssText='display:block;width:100%;height:100%;background-color:'+pointColor(d)+' !important;border-radius:2px;pointer-events:none';pin.append(fill);pin.title=d.name;pin.setAttribute('aria-label',d.name);pin.onclick=()=>{if(canEdit)openEditor(true);else selectPoint(p.id)};if(canEdit)setupDrag(pin,p);plan.append(pin)}const row=document.createElement('div');row.className='entry';const b=document.createElement('button');b.className='btn secondary'+(p.id===selected?' selected':'');b.setAttribute('aria-pressed',p.id===selected?'true':'false');b.textContent=d.name;b.style.borderLeft='7px solid '+pointColor(d);b.onclick=()=>selectPoint(p.id);row.append(b);list.append(row)}}
function setupDrag(el,p){let start=null,moved=false;el.addEventListener('pointerdown',e=>{if(busy)return;start=e.pointerId;moved=false;el.setPointerCapture(e.pointerId);e.preventDefault()});el.addEventListener('pointermove',e=>{if(start!==e.pointerId)return;const r=$('planImg').getBoundingClientRect();if(!r.width||!r.height)return;const x=Math.max(0,Math.min(100,100*(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(100,100*(e.clientY-r.top)/r.height));el.style.left=x+'%';el.style.top=y+'%';moved=true});el.addEventListener('pointerup',async e=>{if(start!==e.pointerId)return;start=null;if(!moved){selectPoint(p.id);openEditor(true);return}const x=parseFloat(el.style.left),y=parseFloat(el.style.top);busy=true;try{await p.ref.update({x,y,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});selected=p.id;await loadPoints();status('Position gespeichert.')}catch(err){status('Position konnte nicht gespeichert werden: '+err.message);render()}finally{busy=false}});el.addEventListener('pointercancel',()=>{start=null;render()})}
async function loadPoints(){const snap=await pointCol().get();points=snap.docs.sort((a,b)=>String(a.data().name||'').localeCompare(String(b.data().name||''),'de'));render()}
function openEditor(rename=false){editing=rename;$('editorTitle').textContent=rename?'Punkt bearbeiten':'Punkt hinzufügen';$('pointName').value=rename?(points.find(x=>x.id===selected)?.data().name||''):'';$('pointColor').value=rename?pointColor(points.find(x=>x.id===selected)?.data()):'#2ecc71';$('pointSize').value=rename?pointSize(points.find(x=>x.id===selected)?.data()):23;$('editor').showModal();$('pointName').focus()}
$('add').onclick=()=>openEditor(false);$('rename').onclick=()=>openEditor(true);$('cancel').onclick=()=>$('editor').close();$('delete').onclick=async()=>{const p=points.find(x=>x.id===selected);if(!canEdit||!p||!confirm('Punkt „'+p.data().name+'“ löschen?'))return;try{await p.ref.delete();selected='';await loadPoints();selectPoint('')}catch(e){alert('Löschen fehlgeschlagen: '+e.message)}};
$('pointForm').onsubmit=async e=>{e.preventDefault();if(!canEdit)return;const name=clean($('pointName').value),color=$('pointColor').value,size=Number($('pointSize').value);if(!name||!/^#[0-9a-fA-F]{6}$/.test(color)||!Number.isInteger(size)||size<8||size>100){alert('Bitte eine gültige Farbe und eine Größe zwischen 8 und 100 Pixel wählen.');return;}$('savePoint').disabled=true;try{if(editing){const p=points.find(x=>x.id===selected);if(!p)throw Error('Punkt nicht gefunden');await p.ref.update({name,color,size,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}else{const ref=await pointCol().add({name,color,size,x:50,y:50,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});selected=ref.id} $('editor').close();await loadPoints();selectPoint(selected);status('Punkt gespeichert.')}catch(err){alert('Speichern fehlgeschlagen: '+err.message)}finally{$('savePoint').disabled=false}};
async function compress(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Nur JPG, PNG oder WebP sind erlaubt.');if(file.size>15*1024*1024)throw Error('Datei zu groß (max. 15 MB).');const bmp=await createImageBitmap(file);try{let w=bmp.width,h=bmp.height;const ratio=Math.min(1,1200/Math.max(w,h));w=Math.max(1,Math.round(w*ratio));h=Math.max(1,Math.round(h*ratio));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(bmp,0,0,w,h);let data='';for(const quality of [.8,.65,.5,.35,.22]){data=canvas.toDataURL('image/webp',quality);if(data.length<680000)break}if(!data.startsWith('data:image/webp;base64,')||data.length>680000)throw Error('Grundriss ist auch nach Komprimierung zu groß. Bitte ein kleineres Bild verwenden.');return data}finally{bmp.close()}}
$('planFile').onchange=async e=>{const file=e.target.files?.[0];if(!file||!canEdit)return;status('Grundriss wird vorbereitet …');try{const image=await compress(file);await db.collection('standortuebersicht').doc(school).set({image,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});$('planImg').src=image;$('plan').hidden=false;status('Grundriss gespeichert. Bestehende Punkte bleiben erhalten.')}catch(err){status('Upload fehlgeschlagen: '+err.message)}finally{e.target.value=''}};
async function canAdmin(user,site){const role=await db.collection('rollen').doc(user.uid).get();const r=role.data()||{};if(String(r.school||'').toUpperCase()==='MASTER'&&String(r.role||'').toLowerCase()==='admin')return true;const admin=['admin','si-fu'].includes(String(r.role||'').toLowerCase());if(admin){if(clean(r.school).toLowerCase()===site)return true;const g=await db.collection('Schulen').doc('MASTER').collection('gruppen').doc(r.school).get();const sites=g.data()?.School||[];if((Array.isArray(sites)?sites:[sites]).some(s=>clean(s).toLowerCase()===site))return true}const org=clean(sessionStorage.getItem('activeOrganisation'));if(!org)return false;const mSnap=await db.collection('mitgliedschaften').doc(user.uid).collection('organisationen').doc(org).get();const m=mSnap.data();if(!m||!['admin','si-fu'].includes(String(m.role||'').toLowerCase()))return false;if(m.scope==='standort')return clean(m.school).toLowerCase()===site;if(m.scope==='gruppe'){const g=await db.collection('Schulen').doc('MASTER').collection('gruppen').doc(org).get();const sites=g.data()?.School||[];return (Array.isArray(sites)?sites:[sites]).some(s=>clean(s).toLowerCase()===site)}return false}
auth.onAuthStateChanged(async user=>{if(!user){location.replace('index.html');return}try{school=clean(sessionStorage.getItem('activeSchool')||sessionStorage.getItem('school')).toLowerCase();if(!school){const r=await db.collection('rollen').doc(user.uid).get();school=clean(r.data()?.school).toLowerCase()}if(!school||school==='master'){$('scope').textContent='Bitte auf der Hauptseite einen Standort auswählen.';status('Kein Standort ausgewählt.');return}$('scope').textContent='Standort: '+school;canEdit=await canAdmin(user,school);$('adminTools').hidden=!canEdit;if(window.applySchoolLogos)await window.applySchoolLogos(school);if(window.orgafunkApplyTheme)window.orgafunkApplyTheme(school);const snap=await db.collection('standortuebersicht').doc(school).get();if(snap.exists&&snap.data().image){$('planImg').src=snap.data().image;$('plan').hidden=false;status('')}else{status(canEdit?'Noch kein Grundriss vorhanden. Lade einen Grundriss hoch.':'Für diesen Standort wurde noch kein Grundriss hinterlegt.')}await loadPoints()}catch(err){console.error(err);status('Standortübersicht konnte nicht geladen werden: '+err.message)}});
</script><script src="branding-layout.js"></script></body></html>
